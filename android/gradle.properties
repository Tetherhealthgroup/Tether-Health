org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9's built-in Kotlin, left off. Our own scripts are migrated, but a
# dependency's are not: app_links (pulled in by supabase_flutter) still applies
# `org.jetbrains.kotlin.android`, and with this true AGP 9 refuses to configure
# it — `flutter build apk` fails inside pub-cache, in a file we do not own.
# Turn this on once every plugin in the graph has migrated, not before.
android.builtInKotlin=false
