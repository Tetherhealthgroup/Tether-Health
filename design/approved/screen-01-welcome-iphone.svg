<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="1" stop-color="#F5F2E8"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFF2E7"/>
      <stop offset="1" stop-color="#BFE1D2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF947D"/>
      <stop offset="1" stop-color="#FF6F54"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#123C37" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#123C37" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#bg)"/>

  <!-- iOS status bar -->
  <g fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700">
    <text x="74" y="76" font-size="36">9:41</text>
    <g transform="translate(1056 43)">
      <rect x="0" y="22" width="10" height="15" rx="3"/>
      <rect x="16" y="17" width="10" height="20" rx="3"/>
      <rect x="32" y="11" width="10" height="26" rx="3"/>
      <rect x="48" y="5" width="10" height="32" rx="3"/>
      <path d="M82 28c12-15 31-15 43 0l-7 7c-8-9-21-9-29 0zm10 10c6-7 16-7 22 0l-11 11z"/>
      <rect x="143" y="9" width="61" height="32" rx="9" fill="none" stroke="#123C37" stroke-width="4"/>
      <rect x="207" y="18" width="5" height="14" rx="2"/>
      <rect x="149" y="15" width="45" height="20" rx="5"/>
    </g>
  </g>

  <!-- Brand and language -->
  <g transform="translate(72 142)">
    <circle cx="38" cy="38" r="36" fill="none" stroke="#123C37" stroke-width="4"/>
    <path d="M47 18c-22 7-29 25-15 41 20-2 31-18 24-38-2-5-5-6-9-3z" fill="url(#leaf)"/>
    <path d="M32 58c6-14 14-24 25-33" fill="none" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round"/>
    <text x="94" y="51" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="45" letter-spacing="-1.2">Tether Health</text>
  </g>
  <g transform="translate(947 148)">
    <rect width="270" height="72" rx="36" fill="#FFFDF7" stroke="#C8D8D1" stroke-width="2"/>
    <circle cx="38" cy="36" r="18" fill="#DFF2E7"/>
    <path d="M28 36h20M38 26c7 6 7 14 0 20M38 26c-7 6-7 14 0 20" stroke="#123C37" stroke-width="2" fill="none"/>
    <text x="70" y="45" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="28">English</text>
    <path d="M225 31l8 9 8-9" fill="none" stroke="#123C37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Calm breathing illustration -->
  <g transform="translate(645 790)">
    <circle r="408" fill="none" stroke="#BDDCCF" stroke-width="2" opacity="0.72"/>
    <circle r="328" fill="none" stroke="#B3D5C7" stroke-width="3" stroke-dasharray="12 18" opacity="0.65"/>
    <circle r="246" fill="url(#mintGlow)" filter="url(#shadow)"/>
    <path d="M-74-60c-108 35-141 125-72 209 98-8 152-88 118-188-9-26-25-31-46-21z" fill="url(#leaf)"/>
    <path d="M-148 150C-108 54-54-11 24-62" fill="none" stroke="#FFFDF7" stroke-width="13" stroke-linecap="round"/>
    <path d="M-71 80c35-5 63-19 84-42M-112 115c-2-28 4-54 17-77" fill="none" stroke="#FFFDF7" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M74-105c68 8 130 49 166 107" fill="none" stroke="#123C37" stroke-width="10" stroke-linecap="round" opacity="0.88"/>
    <path d="M109-43c48 12 87 42 110 82" fill="none" stroke="#123C37" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M127 17c30 10 54 29 68 55" fill="none" stroke="#123C37" stroke-width="7" stroke-linecap="round" opacity="0.38"/>
  </g>

  <!-- Floating trust notes -->
  <g transform="translate(80 945)" filter="url(#softShadow)">
    <rect width="325" height="126" rx="28" fill="#FFFDF7"/>
    <circle cx="61" cy="63" r="31" fill="#DFF2E7"/>
    <path d="M50 64l8 8 16-19" fill="none" stroke="#123C37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="56" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">Private</text>
    <text x="108" y="88" fill="#5D7772" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">by design</text>
  </g>
  <g transform="translate(873 486)" filter="url(#softShadow)">
    <rect width="337" height="126" rx="28" fill="#FFFDF7"/>
    <circle cx="61" cy="63" r="31" fill="#FFF0EB"/>
    <path d="M61 47c-18 0-25 22-12 33l12 10 12-10c13-11 6-33-12-33z" fill="#FF7D61"/>
    <text x="108" y="56" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">No judgment</text>
    <text x="108" y="88" fill="#5D7772" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">just support</text>
  </g>

  <!-- Main content -->
  <text x="72" y="1375" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="5">WELCOME TO TETHER HEALTH</text>
  <text x="72" y="1498" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="88" letter-spacing="-3">
    <tspan x="72" dy="0">Your next breath</tspan>
    <tspan x="72" dy="100">can be different.</tspan>
  </text>
  <text x="72" y="1740" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="43">
    <tspan x="72" dy="0">Small steps, practical support, and no judgment—</tspan>
    <tspan x="72" dy="63">whenever you are ready.</tspan>
  </text>

  <!-- Value pair -->
  <g transform="translate(72 1902)">
    <g>
      <circle cx="36" cy="36" r="36" fill="#DFF2E7"/>
      <path d="M24 36h24M36 24v24" stroke="#123C37" stroke-width="5" stroke-linecap="round"/>
      <text x="92" y="31" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="30">Help when cravings hit</text>
      <text x="92" y="68" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="25">Quick tools that work anywhere</text>
    </g>
    <g transform="translate(590 0)">
      <circle cx="36" cy="36" r="36" fill="#FFF0EB"/>
      <path d="M21 38l10 10 21-27" stroke="#FF7D61" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="31" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="30">Progress that stays</text>
      <text x="92" y="68" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="25">A slip never erases your wins</text>
    </g>
  </g>

  <!-- Actions -->
  <g transform="translate(72 2118)">
    <rect width="1146" height="146" rx="30" fill="#123C37"/>
    <text x="573" y="91" fill="#FFFFFF" text-anchor="middle" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="39">Get started</text>
    <path d="M1054 73h28m-11-11 11 11-11 11" fill="none" stroke="#D5EF75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(72 2292)">
    <rect width="1146" height="132" rx="30" fill="#FFFDF7" stroke="#B6C8C2" stroke-width="3"/>
    <text x="573" y="83" fill="#123C37" text-anchor="middle" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="37">Continuar en español</text>
  </g>

  <text x="645" y="2528" fill="#123C37" text-anchor="middle" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="32">I already have an account</text>
  <line x1="448" y1="2546" x2="842" y2="2546" stroke="#123C37" stroke-width="2"/>

  <text x="645" y="2655" fill="#78908B" text-anchor="middle" font-family="Nimbus Sans, Arial, sans-serif" font-size="25">
    By continuing, you agree to the Terms and acknowledge the Privacy Notice.
  </text>

  <!-- iOS home indicator -->
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
