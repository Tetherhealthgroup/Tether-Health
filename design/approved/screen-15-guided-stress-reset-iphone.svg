<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="s15bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="1" stop-color="#F5F2E8"/>
    </linearGradient>
    <radialGradient id="s15orb" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#EAF8A9"/>
      <stop offset="0.64" stop-color="#D5EF75"/>
      <stop offset="1" stop-color="#A7DFA9"/>
    </radialGradient>
    <linearGradient id="s15mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F5ED"/>
      <stop offset="1" stop-color="#C7E6D8"/>
    </linearGradient>
    <filter id="s15shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="15" stdDeviation="24" flood-color="#123C37" flood-opacity="0.11"/>
    </filter>
    <filter id="s15glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#s15bg)"/>

  <!-- iOS status bar -->
  <g fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700">
    <text x="74" y="76" font-size="36">9:41</text>
    <g transform="translate(1056 43)">
      <rect x="0" y="22" width="10" height="15" rx="3"/>
      <rect x="16" y="17" width="10" height="20" rx="3"/>
      <rect x="32" y="11" width="10" height="26" rx="3"/>
      <rect x="48" y="5" width="10" height="32" rx="3"/>
      <path d="M82 28c12-15 31-15 43 0l-7 7c-8-9-21-9-29 0zm10 10c6-7 16-7 22 0l-11 11z"/>
      <rect x="143" y="9" width="61" height="32" rx="9" fill="none" stroke="#123C37" stroke-width="4"/>
      <rect x="207" y="18" width="5" height="14" rx="2"/>
      <rect x="149" y="15" width="45" height="20" rx="5"/>
    </g>
  </g>

  <!-- Header -->
  <g transform="translate(72 139)">
    <circle cx="38" cy="38" r="36" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/>
    <path d="M27 27l22 22M49 27L27 49" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="645" y="190" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Stress reset</text>
  <g transform="translate(980 146)">
    <rect width="238" height="70" rx="35" fill="#E6F1EA"/>
    <path d="M27 28h13l16-13v40L40 42H27zM66 24c9 8 9 20 0 28" fill="none" stroke="#123C37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="158" y="46" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">VOICE ON</text>
  </g>

  <!-- Overall progress -->
  <g transform="translate(72 280)">
    <text x="0" y="0" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3">STEP 1 OF 3 · BREATHE</text>
    <text x="1146" y="0" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">2:36 LEFT</text>
    <rect y="32" width="1146" height="14" rx="7" fill="#DCE6E0"/>
    <rect y="32" width="153" height="14" rx="7" fill="#FF7D61"/>
  </g>

  <!-- Guided breathing stage -->
  <g transform="translate(72 371)" filter="url(#s15shadow)">
    <rect width="1146" height="1374" rx="48" fill="#123C37"/>
    <circle cx="1018" cy="116" r="142" fill="#214E47" opacity="0.8"/>
    <circle cx="91" cy="1270" r="179" fill="#214E47" opacity="0.65"/>

    <text x="573" y="91" text-anchor="middle" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23" letter-spacing="4">SLOW BREATHING</text>
    <text x="573" y="149" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="39">Breath 3 of 10</text>

    <!-- Calm breathing orb -->
    <g transform="translate(573 518)">
      <circle r="330" fill="#234E48"/>
      <circle r="284" fill="none" stroke="#557B73" stroke-width="3"/>
      <circle r="229" fill="#2B5B53"/>
      <circle r="180" fill="url(#s15orb)" filter="url(#s15glow)"/>
      <text x="0" y="-20" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="43" letter-spacing="4">BREATHE IN</text>
      <text x="0" y="66" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="86">4</text>
      <text x="0" y="106" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="2">SECONDS</text>
    </g>

    <text x="573" y="904" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="34">Slowly breathe in through your nose.</text>
    <text x="573" y="950" text-anchor="middle" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="27">Follow the circle, listen, or use the countdown.</text>

    <!-- Mode controls -->
    <g transform="translate(184 1010)">
      <rect width="365" height="75" rx="37" fill="#234E48" stroke="#477068" stroke-width="2"/>
      <path d="M30 39h13l15-12v27L43 42H30zM68 31c6 6 6 13 0 18" fill="none" stroke="#D5EF75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="215" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Voice guidance on</text>
      <rect x="397" width="381" height="75" rx="37" fill="#234E48" stroke="#477068" stroke-width="2"/>
      <path d="M431 25v28M417 39h28" fill="none" stroke="#D5EF75" stroke-width="4" stroke-linecap="round"/>
      <text x="595" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Reduced motion on</text>
    </g>

    <line x1="42" y1="1135" x2="1104" y2="1135" stroke="#3F6660" stroke-width="2"/>

    <!-- In-exercise controls -->
    <g transform="translate(42 1178)">
      <rect width="678" height="132" rx="31" fill="#D5EF75"/>
      <rect x="82" y="43" width="15" height="46" rx="4" fill="#123C37"/>
      <rect x="107" y="43" width="15" height="46" rx="4" fill="#123C37"/>
      <text x="408" y="83" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="36">Pause exercise</text>
      <rect x="710" width="394" height="132" rx="31" fill="#234E48" stroke="#557B73" stroke-width="3"/>
      <text x="907" y="83" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="31">Skip this step</text>
    </g>
  </g>

  <!-- Exercise sequence -->
  <text x="72" y="1825" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="36">Exercise sequence</text>
  <g transform="translate(72 1863)" filter="url(#s15shadow)">
    <rect width="1146" height="325" rx="38" fill="#FFFDF7"/>
    <line x1="191" y1="91" x2="955" y2="91" stroke="#DCE6E0" stroke-width="8" stroke-linecap="round"/>

    <g transform="translate(93 35)">
      <circle cx="56" cy="56" r="50" fill="#123C37"/>
      <path d="M37 58c8-18 16-18 24 0s16 18 24 0" fill="none" stroke="#D5EF75" stroke-width="5" stroke-linecap="round"/>
      <circle cx="92" cy="18" r="16" fill="#FF7D61"/>
      <text x="56" y="146" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">Breathe</text>
      <text x="56" y="178" text-anchor="middle" fill="#FF7D61" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20">NOW</text>
    </g>

    <g transform="translate(498 35)">
      <circle cx="56" cy="56" r="50" fill="#E6F1EA"/>
      <path d="M38 30h36l-5 50H43zM45 50h22" fill="none" stroke="#718A84" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="146" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">Water</text>
      <text x="56" y="178" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="20">NEXT</text>
    </g>

    <g transform="translate(903 35)">
      <circle cx="56" cy="56" r="50" fill="#E6F1EA"/>
      <path d="M29 64h54M43 78l-14-14 14-14M69 36l14 14-14 14" fill="none" stroke="#718A84" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="146" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">Switch</text>
      <text x="56" y="178" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="20">THEN</text>
    </g>

    <rect x="36" y="251" width="1074" height="46" rx="23" fill="#EFF5F1"/>
    <text x="573" y="282" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">The timer pauses automatically if you leave this screen.</text>
  </g>

  <!-- Support and exit -->
  <g transform="translate(72 2231)">
    <rect width="1146" height="113" rx="29" fill="#FFF0EB" stroke="#FFC6B7" stroke-width="2"/>
    <circle cx="61" cy="57" r="31" fill="#FF7D61"/>
    <path d="M44 59c8-15 15-15 23 0s15 15 23 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="111" y="66" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="28">Craving getting stronger?</text>
    <text x="1060" y="66" text-anchor="end" fill="#FF7D61" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="26">Open Rescue</text>
    <path d="M1080 43l14 14-14 14" fill="none" stroke="#FF7D61" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(72 2386)">
    <rect width="1146" height="111" rx="28" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
    <text x="573" y="70" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="29">End exercise</text>
  </g>

  <text x="645" y="2615" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Partial completion is still saved · Works offline</text>

  <!-- iOS home indicator -->
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
