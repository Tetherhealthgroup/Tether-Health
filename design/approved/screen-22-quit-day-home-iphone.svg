  <text x="72" y="1547" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="37">Today’s essentials</text>
  <text x="1218" y="1547" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">2 items</text>

  <g transform="translate(72 1581)" filter="url(#s22shadow)">
    <rect width="1146" height="333" rx="39" fill="#FFFDF7"/>
    <!-- Check-in -->
    <g transform="translate(35 28)">
      <circle cx="52" cy="52" r="43" fill="#E6F1EA"/>
      <path d="M35 58c7-16 16-16 23 0s16 16 23 0" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round"/>
      <text x="119" y="39" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="1.7">MORNING CHECK-IN</text>
      <text x="119" y="78" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="28">How is your first morning going?</text>
      <g transform="translate(880 18)">
        <rect width="195" height="68" rx="34" fill="#E6F1EA"/>
        <text x="98" y="44" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Check in</text>
      </g>
    </g>
    <line x1="35" y1="145" x2="1111" y2="145" stroke="#E1E9E4" stroke-width="2"/>
    <!-- Medication plan -->
    <g transform="translate(35 177)">
      <circle cx="52" cy="52" r="43" fill="#FFF0EB"/>
      <rect x="36" y="43" width="32" height="18" rx="9" fill="none" stroke="#FF7D61" stroke-width="4"/>
      <path d="M52 43v18" stroke="#FF7D61" stroke-width="4"/>
      <text x="119" y="39" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="1.7">RECORDED TREATMENT PLAN</text>
      <text x="119" y="78" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="28">Confirm your morning plan status</text>
      <g transform="translate(835 18)">
        <rect width="240" height="68" rx="34" fill="#FFF0EB" stroke="#FFC6B7" stroke-width="2"/>
        <text x="120" y="44" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Review status</text>
      </g>
      <text x="119" y="111" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="19">Follow only the plan recorded with you or your care team.</text>
    </g>
  </g>

  <!-- Personal reason and support -->
  <g transform="translate(72 1957)" filter="url(#s22shadow)">
    <rect width="1146" height="152" rx="35" fill="#FFFDF7"/>
    <circle cx="70" cy="76" r="40" fill="#FFF0EB"/>
    <path d="M70 97c-22-15-35-27-35-43 0-20 26-27 35-8 9-19 35-12 35 8 0 16-13 28-35 43z" fill="#FF7D61"/>
    <text x="132" y="59" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="2">YOUR REASON TODAY</text>
    <text x="132" y="105" fill="#123C37" font-family="Georgia, serif" font-style="italic" font-size="36">“Protect my family.”</text>
    <text x="1098" y="86" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="20">From My Plan</text>
  </g>

  <g transform="translate(72 2151)" filter="url(#s22shadow)">
    <rect width="1146" height="176" rx="35" fill="url(#s22coral)" stroke="#FFC6B7" stroke-width="2"/>
    <circle cx="73" cy="74" r="42" fill="#FF7D61"/>
    <circle cx="73" cy="63" r="10" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M54 91c3-15 35-15 38 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="137" y="63" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="30">Jordan is part of your support plan</text>
    <text x="137" y="103" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Send your saved help phrase or contact a quitline counselor.</text>
    <g transform="translate(870 52)">
      <rect width="240" height="72" rx="36" fill="#FF7D61"/>
      <text x="120" y="47" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">View support</text>
    </g>
    <text x="35" y="151" fill="#8B7770" font-family="Nimbus Sans, Arial, sans-serif" font-size="19">Nothing is sent unless you choose it.</text>
  </g>

  <!-- Calm reassurance -->
  <g transform="translate(72 2360)">
    <circle cx="24" cy="24" r="24" fill="#E6F1EA"/>
    <path d="M13 25c7-9 16-9 23 0M19 31c4-4 8-4 12 0" fill="none" stroke="#123C37" stroke-width="4" stroke-linecap="round"/>
    <text x="64" y="33" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">Today adapts to your answers. There is no perfect way to do this.</text>
  </g>

  <!-- Bottom navigation -->
  <g transform="translate(0 2453)" filter="url(#s22navshadow)">
    <path d="M0 32Q0 0 32 0h1226q32 0 32 32v311H0z" fill="#FFFDF7"/>
    <line x1="0" y1="0" x2="1290" y2="0" stroke="#E2E9E5" stroke-width="2"/>

    <g transform="translate(80 35)">
      <rect width="154" height="102" rx="38" fill="#E6F1EA"/>
      <path d="M49 54l28-25 28 25v31H85V65H69v20H49z" fill="none" stroke="#123C37" stroke-width="5" stroke-linejoin="round"/>
      <text x="77" y="133" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="21">Home</text>
    </g>
    <g transform="translate(308 44)">
      <rect x="36" y="4" width="54" height="69" rx="8" fill="none" stroke="#718A84" stroke-width="5"/>
      <path d="M49 25h28M49 41h28M49 57h20" fill="none" stroke="#718A84" stroke-width="4" stroke-linecap="round"/>
      <text x="63" y="124" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Plan</text>
    </g>
    <g transform="translate(542 44)">
      <path d="M31 70V48M56 70V31M81 70V14" fill="none" stroke="#718A84" stroke-width="8" stroke-linecap="round"/>
      <text x="56" y="124" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Progress</text>
    </g>
    <g transform="translate(780 44)">
      <path d="M20 20c19-7 36-4 49 7v52c-13-11-30-14-49-7zM118 20c-19-7-36-4-49 7v52c13-11 30-14 49-7z" fill="none" stroke="#718A84" stroke-width="5" stroke-linejoin="round"/>
      <text x="69" y="124" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Learn</text>
    </g>
    <g transform="translate(1030 44)">
      <circle cx="54" cy="29" r="17" fill="none" stroke="#718A84" stroke-width="5"/>
      <path d="M23 78c5-28 57-28 62 0M89 28h25v20H101l-9 9v-9h-3z" fill="none" stroke="#718A84" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="124" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Support</text>
    </g>
  </g>

  <!-- iOS home indicator -->
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
