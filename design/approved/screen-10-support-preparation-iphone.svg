<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="s10bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="1" stop-color="#F5F2E8"/>
    </linearGradient>
    <linearGradient id="s10mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F5ED"/>
      <stop offset="1" stop-color="#C7E6D8"/>
    </linearGradient>
    <filter id="s10shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#123C37" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#s10bg)"/>

  <!-- iOS status bar -->
  <g fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700">
    <text x="74" y="76" font-size="36">9:41</text>
    <g transform="translate(1056 43)">
      <rect x="0" y="22" width="10" height="15" rx="3"/>
      <rect x="16" y="17" width="10" height="20" rx="3"/>
      <rect x="32" y="11" width="10" height="26" rx="3"/>
      <rect x="48" y="5" width="10" height="32" rx="3"/>
      <path d="M82 28c12-15 31-15 43 0l-7 7c-8-9-21-9-29 0zm10 10c6-7 16-7 22 0l-11 11z"/>
      <rect x="143" y="9" width="61" height="32" rx="9" fill="none" stroke="#123C37" stroke-width="4"/>
      <rect x="207" y="18" width="5" height="14" rx="2"/>
      <rect x="149" y="15" width="45" height="20" rx="5"/>
    </g>
  </g>

  <!-- Header -->
  <g transform="translate(72 139)">
    <circle cx="38" cy="38" r="36" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/>
    <path d="M45 23L30 38l15 15" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="645" y="190" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Support &amp; preparation</text>
  <g transform="translate(1033 149)">
    <rect width="185" height="64" rx="32" fill="#E6F1EA"/>
    <text x="93" y="42" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25" letter-spacing="1.5">4 OF 5</text>
  </g>

  <!-- Plan progress -->
  <g transform="translate(72 278)">
    <text x="0" y="0" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25" letter-spacing="3">QUIT PLAN</text>
    <text x="1146" y="0" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">80%</text>
    <rect y="32" width="1146" height="16" rx="8" fill="#DCE6E0"/>
    <rect y="32" width="917" height="16" rx="8" fill="#FF7D61"/>
  </g>

  <!-- Main copy -->
  <text x="72" y="411" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="5">SET UP FOR SUCCESS</text>
  <text x="72" y="505" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="68" letter-spacing="-3">You don’t have to do this alone.</text>
  <text x="72" y="580" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="33">Choose the support you want. You stay in control of</text>
  <text x="72" y="624" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="33">who is contacted and what is shared.</text>

  <!-- Support circle -->
  <text x="72" y="704" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3">YOUR SUPPORT CIRCLE</text>
  <g transform="translate(984 660)">
    <rect width="234" height="58" rx="29" fill="#E6F1EA"/>
    <text x="117" y="39" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">1 PERSON ADDED</text>
  </g>

  <g transform="translate(72 746)" filter="url(#s10shadow)">
    <rect width="1146" height="267" rx="36" fill="#FFFDF7"/>
    <circle cx="91" cy="87" r="53" fill="url(#s10mint)"/>
    <text x="91" y="101" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="43">J</text>
    <text x="169" y="71" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Jordan</text>
    <text x="169" y="115" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="27">Friend · Text message</text>
    <g transform="translate(944 48)">
      <rect width="154" height="67" rx="34" fill="#123C37"/>
      <circle cx="120" cy="34" r="27" fill="#FFFFFF"/>
    </g>
    <line x1="36" y1="160" x2="1110" y2="160" stroke="#E1E9E4" stroke-width="2"/>
    <circle cx="65" cy="213" r="24" fill="#E6F1EA"/>
    <path d="M65 198v17l12 7" fill="none" stroke="#123C37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106" y="207" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">Check in the evening before my quit date</text>
    <text x="106" y="239" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">Nothing is sent until you review and confirm it.</text>
    <g transform="translate(1022 191)">
      <circle cx="31" cy="31" r="31" fill="#EFF5F1"/>
      <path d="M22 40l3-14 16-16 11 11-16 16z" fill="none" stroke="#123C37" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Add supporter -->
  <g transform="translate(72 1043)">
    <rect width="1146" height="126" rx="29" fill="#FFFDF7" stroke="#AFC6BE" stroke-width="3" stroke-dasharray="12 10"/>
    <circle cx="68" cy="63" r="33" fill="#E6F1EA"/>
    <path d="M68 47v32M52 63h32" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round"/>
    <text x="122" y="73" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="31">Add another support person</text>
    <path d="M1065 49l14 14-14 14" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Environment checklist -->
  <text x="72" y="1243" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3">PREPARE YOUR SPACE</text>
  <text x="1218" y="1243" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">2 OF 3</text>
  <g transform="translate(72 1278)" filter="url(#s10shadow)">
    <rect width="1146" height="391" rx="36" fill="#FFFDF7"/>
    <g transform="translate(36 30)">
      <circle cx="35" cy="35" r="31" fill="#123C37"/>
      <path d="M22 35l9 9 18-23" fill="none" stroke="#D5EF75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="93" y="45" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="29">Remove cigarettes, lighters and ashtrays</text>
    </g>
    <line x1="36" y1="130" x2="1110" y2="130" stroke="#E1E9E4" stroke-width="2"/>
    <g transform="translate(36 160)">
      <circle cx="35" cy="35" r="31" fill="#123C37"/>
      <path d="M22 35l9 9 18-23" fill="none" stroke="#D5EF75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="93" y="45" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="29">Make my home and car smoke-free</text>
    </g>
    <line x1="36" y1="260" x2="1110" y2="260" stroke="#E1E9E4" stroke-width="2"/>
    <g transform="translate(36 290)">
      <circle cx="35" cy="35" r="31" fill="#FFFDF7" stroke="#9EB1AB" stroke-width="3"/>
      <text x="93" y="45" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="29">Stock gum, water or healthy snacks</text>
    </g>
  </g>

  <!-- Treatment support -->
  <text x="72" y="1744" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3">TREATMENT SUPPORT</text>
  <g transform="translate(72 1781)" filter="url(#s10shadow)">
    <rect width="1146" height="307" rx="36" fill="url(#s10mint)" stroke="#B9DCCB" stroke-width="3"/>
    <circle cx="88" cy="83" r="48" fill="#FFFDF7"/>
    <rect x="68" y="51" width="40" height="64" rx="20" fill="none" stroke="#FF7D61" stroke-width="6"/>
    <line x1="69" y1="83" x2="107" y2="83" stroke="#FF7D61" stroke-width="5"/>
    <text x="158" y="70" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="36">Explore quit-smoking medicines</text>
    <text x="158" y="113" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="27">A clinician or pharmacist can help you choose what is safe.</text>
    <g transform="translate(955 49)">
      <rect width="143" height="72" rx="36" fill="#123C37"/>
      <circle cx="107" cy="36" r="28" fill="#FFFFFF"/>
    </g>
    <line x1="36" y1="159" x2="1110" y2="159" stroke="#B7D8C9" stroke-width="2"/>
    <circle cx="70" cy="212" r="25" fill="#123C37"/>
    <path d="M70 201v13M70 224v1" fill="none" stroke="#D5EF75" stroke-width="5" stroke-linecap="round"/>
    <text x="112" y="207" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">Remind me to discuss options with my care team</text>
    <text x="112" y="246" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="24">Education only — this app does not prescribe or change medicines.</text>
    <text x="112" y="281" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Learn about treatment options</text>
    <path d="M1058 256h28m-11-11 11 11-11 11" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Privacy note -->
  <g transform="translate(72 2130)">
    <circle cx="30" cy="30" r="30" fill="#E4F2EA"/>
    <path d="M20 30l7 7 15-19" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="39" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="28">Nothing is shared or sent without your action.</text>
  </g>

  <!-- Action -->
  <g transform="translate(72 2244)">
    <rect width="1146" height="146" rx="30" fill="#123C37"/>
    <text x="573" y="91" fill="#FFFFFF" text-anchor="middle" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="39">Save my support plan</text>
    <path d="M1054 73h28m-11-11 11 11-11 11" fill="none" stroke="#D5EF75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="645" y="2588" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="25">1 supporter · 2 preparation tasks complete</text>
  <text x="645" y="2632" text-anchor="middle" fill="#8BA09A" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Saved automatically</text>

  <!-- iOS home indicator -->
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
