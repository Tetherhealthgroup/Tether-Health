<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="s23bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF8F0"/><stop offset="1" stop-color="#F5F2E8"/></linearGradient>
    <linearGradient id="s23mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8F5ED"/><stop offset="1" stop-color="#C7E6D8"/></linearGradient>
    <linearGradient id="s23hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123C37"/><stop offset="1" stop-color="#1D514A"/></linearGradient>
    <filter id="s23shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#123C37" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1290" height="2796" fill="url(#s23bg)"/>

  <!-- iOS status bar -->
  <g fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700">
    <text x="74" y="76" font-size="36">9:41</text>
    <g transform="translate(1056 43)"><rect x="0" y="22" width="10" height="15" rx="3"/><rect x="16" y="17" width="10" height="20" rx="3"/><rect x="32" y="11" width="10" height="26" rx="3"/><rect x="48" y="5" width="10" height="32" rx="3"/><path d="M82 28c12-15 31-15 43 0l-7 7c-8-9-21-9-29 0zm10 10c6-7 16-7 22 0l-11 11z"/><rect x="143" y="9" width="61" height="32" rx="9" fill="none" stroke="#123C37" stroke-width="4"/><rect x="207" y="18" width="5" height="14" rx="2"/><rect x="149" y="15" width="45" height="20" rx="5"/></g>
  </g>

  <!-- Header -->
  <g transform="translate(72 139)"><circle cx="38" cy="38" r="36" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/><path d="M26 26l24 24M50 26L26 50" fill="none" stroke="#123C37" stroke-width="4.5" stroke-linecap="round"/></g>
  <text x="645" y="190" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Slip recovery</text>
  <g transform="translate(1014 149)"><rect width="204" height="64" rx="32" fill="#E6F1EA"/><path d="M26 28h22v20H26zM31 28v-6c0-8 12-8 12 0v6" fill="none" stroke="#123C37" stroke-width="3"/><text x="129" y="42" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="1.2">PRIVATE</text></g>

  <!-- Compassionate framing -->
  <g transform="translate(72 278)" filter="url(#s23shadow)">
    <rect width="1146" height="298" rx="42" fill="url(#s23mint)" stroke="#B9DCCB" stroke-width="3"/>
    <circle cx="116" cy="149" r="78" fill="#FFFDF7"/>
    <path d="M75 153c24-34 54-34 82 0M87 169c17-20 36-20 56 0" fill="none" stroke="#123C37" stroke-width="7" stroke-linecap="round"/>
    <circle cx="116" cy="118" r="10" fill="#FF7D61"/>
    <text x="230" y="98" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="3">YOUR PROGRESS IS STILL HERE</text>
    <text x="230" y="161" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="46">A slip is information—not the end.</text>
    <text x="230" y="211" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="26">Share only what feels useful. We’ll help with the next choice.</text>
    <text x="230" y="252" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Nothing below changes or deletes your earlier progress.</text>
  </g>

  <!-- Event capture -->
  <g transform="translate(72 620)" filter="url(#s23shadow)">
    <rect width="1146" height="431" rx="41" fill="#FFFDF7"/>
    <text x="36" y="66" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="35">What happened?</text>
    <text x="1110" y="66" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">Choose one</text>
    <g transform="translate(36 101)">
      <rect width="515" height="90" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><circle cx="44" cy="45" r="17" fill="none" stroke="#718A84" stroke-width="3"/><text x="91" y="56" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">A puff or two</text>
      <g transform="translate(559 0)"><rect width="515" height="90" rx="30" fill="url(#s23mint)" stroke="#FF7D61" stroke-width="3"/><circle cx="44" cy="45" r="18" fill="#123C37"/><path d="M36 45l6 6 11-14" fill="none" stroke="#D5EF75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="91" y="56" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">One cigarette</text></g>
      <g transform="translate(0 111)"><rect width="515" height="90" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><circle cx="44" cy="45" r="17" fill="none" stroke="#718A84" stroke-width="3"/><text x="91" y="56" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">More than one</text></g>
      <g transform="translate(559 111)"><rect width="515" height="90" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><circle cx="44" cy="45" r="17" fill="none" stroke="#718A84" stroke-width="3"/><text x="91" y="56" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">Prefer not to answer</text></g>
    </g>
    <text x="36" y="346" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">WHEN?</text>
    <g transform="translate(166 306)"><rect width="221" height="65" rx="31" fill="#123C37"/><text x="111" y="43" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">Just now</text><rect x="239" width="246" height="65" rx="31" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/><text x="362" y="43" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">Earlier today</text><rect x="503" width="229" height="65" rx="31" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/><text x="618" y="43" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">Another day</text></g>
  </g>

  <!-- Trigger review -->
  <g transform="translate(72 1094)" filter="url(#s23shadow)">
    <rect width="1146" height="338" rx="41" fill="#FFFDF7"/>
    <text x="36" y="65" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="34">What was happening?</text>
    <text x="1110" y="65" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">Optional</text>
    <text x="36" y="106" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Choose any that fit. This helps update your trigger plan.</text>
    <g transform="translate(36 148)">
      <rect width="226" height="73" rx="30" fill="url(#s23mint)" stroke="#FF7D61" stroke-width="3"/><circle cx="39" cy="37" r="17" fill="#FF7D61"/><path d="M31 37l6 6 11-14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="143" y="47" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Stress</text>
      <rect x="244" width="282" height="73" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><text x="385" y="47" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Around smokers</text>
      <rect x="544" width="244" height="73" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><text x="666" y="47" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Routine</text>
      <rect x="806" width="268" height="73" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><text x="940" y="47" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Alcohol</text>
      <rect y="92" width="269" height="73" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><text x="135" y="139" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">After a meal</text>
      <rect x="287" y="92" width="242" height="73" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><text x="408" y="139" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Not sure</text>
      <rect x="547" y="92" width="294" height="73" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><text x="694" y="139" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">Something else</text>
    </g>
  </g>

  <!-- Plan choice -->
  <g transform="translate(72 1475)" filter="url(#s23shadow)">
    <rect width="1146" height="421" rx="41" fill="#FFFDF7"/>
    <text x="36" y="65" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="34">What feels right now?</text>
    <text x="36" y="106" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">You stay in control of the plan.</text>
    <g transform="translate(36 139)">
      <rect width="1074" height="121" rx="32" fill="url(#s23mint)" stroke="#FF7D61" stroke-width="3"/>
      <circle cx="55" cy="60" r="23" fill="#123C37"/><path d="M44 60l8 8 15-19" fill="none" stroke="#D5EF75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="49" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="28">Continue from this moment</text>
      <text x="104" y="84" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Keep the current quit plan and update support for today.</text>
      <g transform="translate(839 30)"><rect width="198" height="61" rx="30" fill="#123C37"/><text x="99" y="40" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20">RECOMMENDED</text></g>
      <g transform="translate(0 145)"><rect width="515" height="108" rx="31" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><circle cx="53" cy="54" r="21" fill="none" stroke="#718A84" stroke-width="3"/><text x="94" y="48" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">Choose a new quit time</text><text x="94" y="79" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="19">Today or another date</text></g>
      <g transform="translate(559 145)"><rect width="515" height="108" rx="31" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/><circle cx="53" cy="54" r="21" fill="none" stroke="#718A84" stroke-width="3"/><text x="94" y="48" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">Help me decide</text><text x="94" y="79" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="19">Review options without pressure</text></g>
    </g>
  </g>

  <!-- Immediate next step -->
  <g transform="translate(72 1939)" filter="url(#s23shadow)">
    <rect width="1146" height="234" rx="39" fill="url(#s23hero)"/>
    <text x="36" y="55" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">YOUR NEXT STEP</text>
    <text x="36" y="105" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="31">Move cigarettes out of reach, then use a 2-minute Rescue.</text>
    <text x="36" y="146" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">Based on the stress trigger and what helped before.</text>
    <g transform="translate(838 128)"><rect width="272" height="72" rx="36" fill="#D5EF75"/><text x="136" y="47" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Open after saving</text></g>
    <text x="36" y="202" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="19">You can switch tools or contact support at any time.</text>
  </g>

  <!-- Support and privacy -->
  <g transform="translate(72 2216)" filter="url(#s23shadow)">
    <rect width="1146" height="133" rx="33" fill="#FFF0EB" stroke="#FFC6B7" stroke-width="2"/>
    <circle cx="61" cy="65" r="31" fill="#FF7D61"/><circle cx="61" cy="56" r="8" fill="none" stroke="#FFFFFF" stroke-width="3"/><path d="M47 80c2-11 26-11 28 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="111" y="54" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">Want Jordan or a quitline counselor?</text>
    <text x="111" y="91" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">No one is notified unless you choose.</text>
    <g transform="translate(907 31)"><rect width="203" height="72" rx="36" fill="#FF7D61"/><text x="102" y="47" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23">View support</text></g>
  </g>

  <!-- Primary action -->
  <g transform="translate(72 2393)"><rect width="1146" height="143" rx="31" fill="#123C37"/><text x="573" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Save and start recovery</text><path d="M1052 72h30m-11-11 11 11-11 11" fill="none" stroke="#D5EF75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(72 2574)"><rect width="1146" height="85" rx="27" fill="#EFF5F1"/><path d="M43 36h27v24H43zM49 36v-7c0-10 15-10 15 0v7" fill="none" stroke="#718A84" stroke-width="4" stroke-linecap="round"/><text x="91" y="53" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Saves offline and syncs once. You can delete this event later.</text><text x="1095" y="53" text-anchor="end" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="19">Content v1.0</text></g>
  <text x="645" y="2701" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Skip for now and return Home</text>
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
