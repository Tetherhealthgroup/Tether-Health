name: Flutter CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create generated platform runners
        run: flutter create . --project-name tether_health --org com.tetherhealthgroup --platforms=android,web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The Unplug channel contract is generated for three languages and the
      # output is checked in. If someone edits pigeons/unplug_api.dart without
      # regenerating, Dart and the native sides drift apart silently — so the
      # build regenerates and fails on any difference.
      - name: Channel contract is up to date
        run: |
          ./tool/generate_pigeon.sh
          git diff --exit-code -- \
            lib/unplug/platform/unplug_api.g.dart \
            ios/Runner/Unplug/UnplugApi.g.swift \
            android/app/src/main/kotlin/com/tetherhealthgroup/tetherhealth/unplug/UnplugApi.g.kt
      - run: flutter build web --release
      - run: flutter build appbundle --debug
      # A debug APK a reviewer can sideload. The Unplug intercept is a
      # foreground service and an overlay, and neither can be judged from a
      # screenshot — they have to be installed and watched.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: breathefree-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
