name: Production MVP CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: sh tool/check_format.sh
      - run: flutter analyze
      - name: Accessibility, offline, and program integration coverage
        run: flutter test test/accessibility test/programs test/profile test/auth
      - run: flutter test
      - name: Build unsigned Android release bundle
        env:
          # Explicit opt-in: Gradle otherwise refuses release builds without an
          # upload key. The bundle stays unsigned; the debug key is never used.
          TETHER_ALLOW_UNSIGNED_RELEASE: "1"
        run: flutter build appbundle --release

  ios-no-codesign:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # TH-112 (TH-099 gap G-7): pin Xcode so the iOS build does not depend on
      # the runner default. The macos-15 image default is Xcode 16.4, which is
      # below Apple's minimum (Xcode 26 or later, iOS 26 SDK, for App Store
      # Connect uploads since 2026-04-28).
      # Pinned: Xcode 26.3, listed on macos-15 image 20260824.0482.1 (SDK
      # iphoneos26.2). Sources read 2026-10-13:
      #   https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
      #   https://developer.apple.com/news/upcoming-requirements/
      # Runner images rotate; if this step fails with "No such file", re-check
      # the Readme's Xcode table and update the version here.
      - name: Select Xcode 26.3 and print versions
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -showsdks
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator
      - run: flutter build ios --release --no-codesign

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Static migration checks
        run: for f in supabase/tests/verify_*.sh; do bash "$f" || exit 1; done
      - name: Apply all migrations to local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset --local --no-seed
      - run: supabase db lint --local --level warning
      - name: Migration checks against the local database
        env:
          # Local CLI database (supabase/config.toml port); not a remote project.
          VERIFY_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: for f in supabase/tests/verify_*.sh; do bash "$f" || exit 1; done

  # TH-906: the vendored UI package (tether_ui/, P-01). Generated files are
  # never hand-edited (P-02): regenerating from tether_ui/generator must
  # reproduce the committed tree exactly.
  tether_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Spec validator (no loose ends)
        working-directory: tether_ui/generator
        run: python3 validate.py
      - name: Regeneration is diff-clean (in place, on a scratch copy)
        # Regenerates a scratch copy in place (generator inside the output
        # tree, as in the repo) and compares it with the checkout. Runs
        # before pub get, so neither tree has .dart_tool/ or pubspec.lock.
        run: |
          scratch="$RUNNER_TEMP/regen"
          mkdir -p "$scratch"
          cp -R tether_ui "$scratch/"
          python3 "$scratch/tether_ui/generator/build_all.py"
          test -f "$scratch/tether_ui/generator/build_all.py"
          diff -r -x __pycache__ tether_ui "$scratch/tether_ui"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Package pub get, analyze and test
        working-directory: tether_ui/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
