name: Production MVP CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Create generated platform runners
        run: flutter create . --project-name tether_health --org com.TetherHealthLLC --platforms=android,web
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # Both channel contracts — the Unplug screen-time boundary and the shell's
      # key/value store — are generated for three languages and the output is
      # checked in. If someone edits a pigeons/*.dart without regenerating, Dart
      # and the native sides drift apart silently, so the build regenerates and
      # fails on any difference.
      - name: Channel contract is up to date
        run: |
          ./tool/generate_pigeon.sh
          git diff --exit-code -- \
            lib/unplug/platform/unplug_api.g.dart \
            ios/Runner/Unplug/UnplugApi.g.swift \
            android/app/src/main/kotlin/com/TetherHealthLLC/tetherhealth/unplug/UnplugApi.g.kt \
            lib/tether/platform/tether_store_api.g.dart \
            ios/Runner/Store/TetherStoreApi.g.swift \
            android/app/src/main/kotlin/com/TetherHealthLLC/tetherhealth/store/TetherStoreApi.g.kt
      - run: flutter build web --release
      - run: flutter build appbundle --debug
      # A debug APK a reviewer can sideload. The Unplug intercept is a
      # foreground service and an overlay, and neither can be judged from a
      # screenshot — they have to be installed and watched.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: breathefree-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Build unsigned Android release bundle
        run: flutter build appbundle --release

  ios-no-codesign:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator
      - run: flutter build ios --release --no-codesign

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: bash supabase/tests/verify_profiles_migration.sh
      - run: bash supabase/tests/verify_quit_plans_migration.sh
      - run: bash supabase/tests/verify_account_deletion_migration.sh
      - name: Apply all migrations to local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset --local --no-seed
      - run: supabase db lint --local --level warning
