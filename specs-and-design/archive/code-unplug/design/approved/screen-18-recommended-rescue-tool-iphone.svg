    <circle cx="38" cy="38" r="36" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/>
    <path d="M45 23L30 38l15 15" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="645" y="190" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Craving Rescue</text>
  <g transform="translate(1014 149)">
    <rect width="204" height="64" rx="32" fill="#E6F1EA"/>
    <text x="102" y="42" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23" letter-spacing="1.4">2 OF 5</text>
  </g>

  <!-- Rescue progress -->
  <g transform="translate(72 278)">
    <text x="0" y="0" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3">CHOOSE SUPPORT</text>
    <text x="1146" y="0" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">40%</text>
    <rect y="32" width="1146" height="14" rx="7" fill="#DCE6E0"/>
    <rect y="32" width="458" height="14" rx="7" fill="#FF7D61"/>
