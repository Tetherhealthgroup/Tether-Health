      <rect width="280" height="59" rx="29" fill="#234E48" stroke="#477068" stroke-width="2"/>
      <circle cx="31" cy="30" r="15" fill="#FF7D61"/>
      <text x="166" y="39" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">Stress selected</text>
      <rect x="298" width="270" height="59" rx="29" fill="#234E48" stroke="#477068" stroke-width="2"/>
      <path d="M327 31c7-9 16-9 23 0M333 39c4-4 8-4 12 0" fill="none" stroke="#D5EF75" stroke-width="3" stroke-linecap="round"/>
      <text x="444" y="39" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">Works offline</text>
      <rect x="586" width="330" height="59" rx="29" fill="#234E48" stroke="#477068" stroke-width="2"/>
      <path d="M616 25h12l14-11v31l-14-11h-12z" fill="none" stroke="#D5EF75" stroke-width="3" stroke-linejoin="round"/>
      <text x="765" y="39" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">Voice optional</text>
    </g>

    <g transform="translate(42 584)">
      <rect width="1062" height="96" rx="29" fill="#D5EF75"/>
      <circle cx="57" cy="48" r="26" fill="#123C37"/>
      <path d="M50 36v24l19-12z" fill="#D5EF75"/>
      <text x="531" y="61" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="34">Start 2-minute breathing</text>
      <path d="M985 48h29m-11-11 11 11-11 11" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
