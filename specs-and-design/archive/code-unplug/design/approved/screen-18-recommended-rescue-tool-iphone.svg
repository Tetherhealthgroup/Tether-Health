  <!-- Bottom action -->
  <g transform="translate(72 2230)">
    <rect width="1146" height="149" rx="31" fill="#123C37"/>
    <text x="573" y="93" fill="#FFFFFF" text-anchor="middle" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="39">Start recommended tool</text>
    <path d="M1054 75h28m-11-11 11 11-11 11" fill="none" stroke="#D5EF75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(72 2423)">
    <rect width="1146" height="103" rx="27" fill="#EFF5F1"/>
    <path d="M45 44h28v25H45zM51 44v-8c0-11 16-11 16 0v8" fill="none" stroke="#718A84" stroke-width="4" stroke-linecap="round"/>
    <text x="94" y="62" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Recommendation uses your data only for personalized support.</text>
    <text x="1094" y="62" text-anchor="end" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="21">Content v1.0</text>
  </g>

  <text x="645" y="2635" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">You can switch tools at any time</text>

  <!-- iOS home indicator -->
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
