      <circle cx="77" cy="74" r="44" fill="#E6F1EA"/>
      <path d="M52 84c13-6 20-18 22-36M75 48c9 8 18 14 29 18M64 88l-12 28M82 87l20 24" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="139" y="67" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="31">Move for 3 minutes</text>
      <text x="139" y="106" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Walk or stretch</text>
      <line x1="36" y1="152" x2="519" y2="152" stroke="#E1E9E4" stroke-width="2"/>
      <text x="36" y="205" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Offline · No equipment</text>
      <path d="M476 188l14 14-14 14" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(591 0)" filter="url(#s18shadow)">
      <rect width="555" height="251" rx="35" fill="#FFFDF7"/>
      <circle cx="77" cy="74" r="44" fill="#FFF0EB"/>
      <path d="M52 75h50M64 57L48 75l16 18M90 57l16 18-16 18" fill="none" stroke="#FF7D61" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="139" y="67" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="31">Change the scene</text>
      <text x="139" y="106" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Go somewhere smoke-free</text>
      <line x1="36" y1="152" x2="519" y2="152" stroke="#E1E9E4" stroke-width="2"/>
      <text x="36" y="205" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Quick environment shift</text>
      <path d="M476 188l14 14-14 14" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Strong craving support -->
  <g transform="translate(72 1988)" filter="url(#s18shadow)">
    <rect width="1146" height="195" rx="35" fill="#FFF0EB" stroke="#FFC6B7" stroke-width="3"/>
    <circle cx="78" cy="78" r="44" fill="#FF7D61"/>
    <circle cx="78" cy="65" r="12" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M55 101c3-17 43-17 46 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="143" y="65" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="32">Your craving is strong. Want a person?</text>
    <text x="143" y="106" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="24">Contact Jordan or a trained quitline counselor.</text>
    <g transform="translate(876 48)">
