  <!-- Main copy -->
  <text x="72" y="416" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27" letter-spacing="5">BEST MATCH</text>
  <text x="72" y="508" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="67" letter-spacing="-3">Start with what helped before.</text>
  <text x="72" y="579" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="31">One recommended action, based on this craving and your results.</text>

  <!-- Recommended tool -->
  <g transform="translate(72 637)" filter="url(#s18shadow)">
    <rect width="1146" height="714" rx="45" fill="url(#s18hero)"/>
    <circle cx="935" cy="175" r="205" fill="#285850" opacity="0.84"/>
    <circle cx="935" cy="175" r="150" fill="none" stroke="#648980" stroke-width="3"/>
    <circle cx="935" cy="175" r="105" fill="#D5EF75"/>
    <text x="935" y="170" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="49">2:00</text>
    <text x="935" y="207" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="2">MINUTES</text>

    <g transform="translate(42 37)">
      <rect width="237" height="57" rx="29" fill="#234E48"/>
      <circle cx="31" cy="29" r="17" fill="#FF7D61"/>
      <path d="M22 29l6 6 11-14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="142" y="38" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="1">RECOMMENDED</text>
    </g>
    <text x="42" y="157" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="52">Slow breathing</text>
    <text x="42" y="207" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="29">Let the urge rise and fall while you follow</text>
    <text x="42" y="247" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="29">a calm breathing cue.</text>

    <!-- Prior result -->
    <g transform="translate(42 302)">
      <rect width="1062" height="153" rx="30" fill="#234E48"/>
      <text x="31" y="42" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">YOUR LAST RESULT</text>
      <text x="31" y="89" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="29">Slow breathing was selected as most helpful.</text>
      <text x="31" y="126" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Craving changed from 6 to 3 after the exercise.</text>
      <g transform="translate(827 35)">
        <rect width="201" height="82" rx="28" fill="#D5EF75"/>
        <text x="100" y="35" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">6 → 3</text>
        <text x="100" y="62" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="17">LAST TIME</text>
      </g>
