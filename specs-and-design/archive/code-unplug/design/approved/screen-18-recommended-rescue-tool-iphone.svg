  <!-- Why this match -->
  <g transform="translate(72 1394)" filter="url(#s18shadow)">
    <rect width="1146" height="187" rx="34" fill="url(#s18mint)" stroke="#B9DCCB" stroke-width="3"/>
    <circle cx="75" cy="76" r="40" fill="#FFFDF7"/>
    <path d="M75 54v24l17 10" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="138" y="62" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="31">Why this match?</text>
    <text x="138" y="104" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="25">Stress trigger + strong craving + your previous helpful result.</text>
    <text x="138" y="143" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">You can turn personalized recommendations off in Settings.</text>
    <path d="M1063 69l14 14-14 14" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Alternatives -->
  <text x="72" y="1657" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="36">Or choose another action</text>
  <text x="1218" y="1657" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Your choice</text>

