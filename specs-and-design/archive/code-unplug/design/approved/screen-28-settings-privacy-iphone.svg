    <g transform="translate(42 34)"><rect width="224" height="48" rx="24" fill="#234E48"/><circle cx="26" cy="24" r="12" fill="#D5EF75"/><path d="M21 24l4 4 8-10" fill="none" stroke="#123C37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="32" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="17" letter-spacing="1.4">PRIVATE BY DEFAULT</text></g>
