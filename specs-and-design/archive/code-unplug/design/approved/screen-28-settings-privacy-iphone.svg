<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="s28bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF8F0"/><stop offset="1" stop-color="#F5F2E8"/></linearGradient>
    <linearGradient id="s28hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123C37"/><stop offset="1" stop-color="#1D514A"/></linearGradient>
    <linearGradient id="s28mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8F5ED"/><stop offset="1" stop-color="#C7E6D8"/></linearGradient>
