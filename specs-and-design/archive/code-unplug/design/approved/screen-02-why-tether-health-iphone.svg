<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="screen2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="1" stop-color="#F5F2E8"/>
    </linearGradient>
    <linearGradient id="screen2Mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2F3EA"/>
      <stop offset="1" stop-color="#BFE1D2"/>
    </linearGradient>
    <filter id="screen2Shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#123C37" flood-opacity="0.11"/>
    </filter>
    <filter id="screen2Soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#123C37" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#screen2Bg)"/>

  <!-- iOS status bar -->
  <g fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700">
    <text x="74" y="76" font-size="36">9:41</text>
    <g transform="translate(1056 43)">
      <rect x="0" y="22" width="10" height="15" rx="3"/>
      <rect x="16" y="17" width="10" height="20" rx="3"/>
      <rect x="32" y="11" width="10" height="26" rx="3"/>
      <rect x="48" y="5" width="10" height="32" rx="3"/>
      <path d="M82 28c12-15 31-15 43 0l-7 7c-8-9-21-9-29 0zm10 10c6-7 16-7 22 0l-11 11z"/>
      <rect x="143" y="9" width="61" height="32" rx="9" fill="none" stroke="#123C37" stroke-width="4"/>
      <rect x="207" y="18" width="5" height="14" rx="2"/>
      <rect x="149" y="15" width="45" height="20" rx="5"/>
    </g>
  </g>

  <!-- Navigation header -->
  <g transform="translate(72 139)">
    <circle cx="38" cy="38" r="36" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/>
    <path d="M45 23L30 38l15 15" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(493 145)">
    <circle cx="31" cy="31" r="29" fill="none" stroke="#123C37" stroke-width="3"/>
    <path d="M38 15c-18 5-23 20-12 33 16-1 25-14 20-30-2-4-4-5-8-3z" fill="#FF7D61"/>
    <path d="M27 48c5-11 11-19 20-26" fill="none" stroke="#FFFDF7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="76" y="42" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38" letter-spacing="-1">Tether Health</text>
  </g>
  <g transform="translate(1055 149)">
    <rect width="163" height="64" rx="32" fill="#E6F1EA"/>
    <text x="82" y="42" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25" letter-spacing="2">1 OF 3</text>
  </g>

  <!-- Main illustration: the app surrounding difficult moments -->
  <g transform="translate(645 696)">
    <circle r="385" fill="none" stroke="#C5DED4" stroke-width="2"/>
    <circle r="304" fill="none" stroke="#BCD9CD" stroke-width="3" stroke-dasharray="13 18"/>
    <circle r="220" fill="url(#screen2Mint)" filter="url(#screen2Shadow)"/>

    <!-- center calm mark -->
    <circle r="94" fill="#FFFDF7" filter="url(#screen2Soft)"/>
    <path d="M-30 3c18-27 43-27 61 0M-42 31c26-38 58-38 84 0M-17-26c10-14 24-14 34 0" fill="none" stroke="#123C37" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="51" r="8" fill="#FF7D61"/>

    <!-- connecting routes -->
    <path d="M-78-190C-148-266-220-264-278-220" fill="none" stroke="#8EB9AA" stroke-width="5" stroke-linecap="round"/>
    <path d="M194-75C272-70 300-18 306 49" fill="none" stroke="#8EB9AA" stroke-width="5" stroke-linecap="round"/>
    <path d="M64 203C70 273 28 309-33 327" fill="none" stroke="#8EB9AA" stroke-width="5" stroke-linecap="round"/>

    <!-- craving tool node -->
    <g transform="translate(-292 -237)" filter="url(#screen2Soft)">
      <circle r="78" fill="#FFFDF7"/>
      <circle r="47" fill="#FFF0EB"/>
      <path d="M-16 1c9-16 23-16 32 0M-23 19c14-23 32-23 46 0M-8-16c5-8 11-8 16 0" fill="none" stroke="#FF7D61" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- progress node -->
    <g transform="translate(309 69)" filter="url(#screen2Soft)">
      <circle r="78" fill="#FFFDF7"/>
      <circle r="47" fill="#E4F2EA"/>
      <path d="M-22 19V-2M0 19v-37M22 19V-9" fill="none" stroke="#123C37" stroke-width="9" stroke-linecap="round"/>
      <circle cx="0" cy="-23" r="8" fill="#FF7D61"/>
    </g>

    <!-- recovery node -->
    <g transform="translate(-43 338)" filter="url(#screen2Soft)">
      <circle r="78" fill="#FFFDF7"/>
      <circle r="47" fill="#F0F5D2"/>
      <path d="M-20 4l15 15 30-38" fill="none" stroke="#123C37" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Main copy -->
  <text x="72" y="1150" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="5">A BETTER WAY TO QUIT</text>
  <text x="72" y="1267" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="80" letter-spacing="-3">
    <tspan x="72" dy="0">Support for the moments</tspan>
    <tspan x="72" dy="91">that matter most.</tspan>
  </text>
  <text x="72" y="1497" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="40">
    <tspan x="72" dy="0">Tether Health responds to what you need now—and helps</tspan>
    <tspan x="72" dy="58">you protect the progress you have already made.</tspan>
  </text>

  <!-- Feature cards -->
  <g transform="translate(72 1640)">
    <rect width="1146" height="202" rx="32" fill="#FFFDF7" stroke="#D5E0DA" stroke-width="2" filter="url(#screen2Shadow)"/>
    <circle cx="91" cy="101" r="48" fill="#FFF0EB"/>
    <path d="M69 102c13-22 31-22 44 0M61 126c19-32 43-32 62 0M80 75c7-11 15-11 22 0" fill="none" stroke="#FF7D61" stroke-width="7" stroke-linecap="round"/>
    <text x="171" y="82" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="36">When a craving hits</text>
    <text x="171" y="128" fill="#617B75" font-family="Nimbus Sans, Arial, sans-serif" font-size="30">Open a calming tool in one tap—available offline.</text>
    <circle cx="1070" cy="101" r="28" fill="#E5F1EA"/>
    <path d="M1062 101h17m-7-8 8 8-8 8" fill="none" stroke="#123C37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(72 1870)">
    <rect width="1146" height="202" rx="32" fill="#FFFDF7" stroke="#D5E0DA" stroke-width="2"/>
    <circle cx="91" cy="101" r="48" fill="#E4F2EA"/>
    <path d="M67 124V99M91 124V76M115 124V89" fill="none" stroke="#123C37" stroke-width="8" stroke-linecap="round"/>
    <circle cx="91" cy="65" r="7" fill="#FF7D61"/>
    <text x="171" y="82" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="36">As your body heals</text>
    <text x="171" y="128" fill="#617B75" font-family="Nimbus Sans, Arial, sans-serif" font-size="30">See smoke-free time, money saved, and recovery.</text>
    <circle cx="1070" cy="101" r="28" fill="#E5F1EA"/>
    <path d="M1062 101h17m-7-8 8 8-8 8" fill="none" stroke="#123C37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(72 2100)">
    <rect width="1146" height="202" rx="32" fill="#E1F0E7" stroke="#B8D7C9" stroke-width="2"/>
    <circle cx="91" cy="101" r="48" fill="#F3F8D8"/>
    <path d="M68 103l16 16 32-40" fill="none" stroke="#123C37" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="171" y="82" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="36">If a slip happens</text>
    <text x="171" y="128" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="30">Keep your progress. Learn, adjust, and continue.</text>
    <circle cx="1070" cy="101" r="28" fill="#FFFDF7"/>
    <path d="M1062 101h17m-7-8 8 8-8 8" fill="none" stroke="#123C37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Primary action -->
  <g transform="translate(72 2388)">
    <rect width="1146" height="146" rx="30" fill="#123C37"/>
    <text x="573" y="91" fill="#FFFFFF" text-anchor="middle" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="39">Continue</text>
    <path d="M1054 73h28m-11-11 11 11-11 11" fill="none" stroke="#D5EF75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Onboarding progress -->
  <g transform="translate(570 2622)">
    <rect width="70" height="16" rx="8" fill="#FF7D61"/>
    <circle cx="98" cy="8" r="8" fill="#B9C9C3"/>
    <circle cx="132" cy="8" r="8" fill="#B9C9C3"/>
  </g>

  <!-- iOS home indicator -->
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
