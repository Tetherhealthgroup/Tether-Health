<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="s19bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="1" stop-color="#F4F2E8"/>
    </linearGradient>
    <linearGradient id="s19hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103A35"/>
      <stop offset="1" stop-color="#1C5149"/>
    </linearGradient>
    <radialGradient id="s19orb" cx="50%" cy="42%" r="63%">
      <stop offset="0" stop-color="#E8F99A"/>
      <stop offset="0.72" stop-color="#D5EF75"/>
      <stop offset="1" stop-color="#BFD95B"/>
    </radialGradient>
    <linearGradient id="s19mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6EF"/>
      <stop offset="1" stop-color="#CCE8DB"/>
    </linearGradient>
    <filter id="s19shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#123C37" flood-opacity="0.11"/>
    </filter>
    <filter id="s19orbshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#071F1C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#s19bg)"/>

  <!-- iOS status bar -->
  <g fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700">
    <text x="74" y="76" font-size="36">9:41</text>
    <g transform="translate(1056 43)">
      <rect x="0" y="22" width="10" height="15" rx="3"/>
      <rect x="16" y="17" width="10" height="20" rx="3"/>
      <rect x="32" y="11" width="10" height="26" rx="3"/>
      <rect x="48" y="5" width="10" height="32" rx="3"/>
      <path d="M82 28c12-15 31-15 43 0l-7 7c-8-9-21-9-29 0zm10 10c6-7 16-7 22 0l-11 11z"/>
      <rect x="143" y="9" width="61" height="32" rx="9" fill="none" stroke="#123C37" stroke-width="4"/>
      <rect x="207" y="18" width="5" height="14" rx="2"/>
      <rect x="149" y="15" width="45" height="20" rx="5"/>
    </g>
  </g>

  <!-- Header -->
  <g transform="translate(72 139)">
    <circle cx="38" cy="38" r="36" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/>
    <path d="M26 26l24 24M50 26L26 50" fill="none" stroke="#123C37" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <text x="645" y="190" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Craving Rescue</text>
  <g transform="translate(1014 149)">
    <rect width="204" height="64" rx="32" fill="#E6F1EA"/>
    <text x="102" y="42" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23" letter-spacing="1.4">3 OF 5</text>
  </g>

  <!-- Rescue progress -->
  <g transform="translate(72 278)">
    <text x="0" y="0" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3">ACTIVE TOOL</text>
    <text x="1146" y="0" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">60%</text>
    <rect y="32" width="1146" height="14" rx="7" fill="#DCE6E0"/>
    <rect y="32" width="688" height="14" rx="7" fill="#FF7D61"/>
  </g>

  <!-- Main copy -->
  <text x="72" y="426" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="67" letter-spacing="-2.5">Stay with this moment.</text>
  <text x="72" y="493" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="31">Follow the circle—or breathe slowly in your own way.</text>

  <!-- Active breathing experience -->
  <g transform="translate(72 559)" filter="url(#s19shadow)">
    <rect width="1146" height="1242" rx="48" fill="url(#s19hero)"/>

    <!-- Tool and remaining time -->
    <g transform="translate(42 40)">
      <rect width="284" height="58" rx="29" fill="#234E48" stroke="#477068" stroke-width="2"/>
      <circle cx="31" cy="29" r="15" fill="#FF7D61"/>
      <path d="M24 29h14M31 22v14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="163" y="38" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="1.1">SLOW BREATHING</text>
    </g>
    <g transform="translate(876 40)">
      <rect width="228" height="58" rx="29" fill="#D5EF75"/>
      <text x="114" y="38" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing=".5">1:32 LEFT</text>
    </g>

    <!-- Ambient breathing rings -->
    <circle cx="573" cy="484" r="346" fill="#2A5C54" opacity="0.38"/>
    <circle cx="573" cy="484" r="295" fill="none" stroke="#6A8E86" stroke-width="3" opacity="0.55"/>
    <circle cx="573" cy="484" r="253" fill="#2B6258" opacity="0.72"/>
    <circle cx="573" cy="484" r="208" fill="url(#s19orb)" filter="url(#s19orbshadow)"/>

    <!-- Direction and phase -->
    <text x="573" y="417" text-anchor="middle" fill="#365A51" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25" letter-spacing="3.5">BREATHE OUT</text>
    <text x="573" y="493" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="54">Slowly</text>
    <text x="573" y="594" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="101">5</text>
    <text x="573" y="637" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">SECONDS</text>
    <text x="573" y="770" text-anchor="middle" fill="#D5E4DE" font-family="Nimbus Sans, Arial, sans-serif" font-size="27">Let your shoulders soften as you exhale.</text>

    <!-- Breath cycle -->
    <g transform="translate(82 823)">
      <text x="0" y="0" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">THIS BREATH</text>
      <text x="982" y="0" text-anchor="end" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="20">In 4 · Out 6</text>
      <rect y="29" width="982" height="16" rx="8" fill="#315E57"/>
      <rect y="29" width="615" height="16" rx="8" fill="#D5EF75"/>
      <circle cx="615" cy="37" r="18" fill="#FFFDF7" stroke="#D5EF75" stroke-width="6"/>
      <text x="0" y="91" fill="#D5E4DE" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">Inhale gently</text>
      <text x="982" y="91" text-anchor="end" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">Exhale slowly</text>
    </g>

    <!-- Controls -->
    <g transform="translate(64 980)">
      <g>
        <rect width="322" height="116" rx="34" fill="#FFFDF7"/>
        <circle cx="58" cy="58" r="29" fill="#123C37"/>
        <rect x="49" y="45" width="6" height="26" rx="3" fill="#D5EF75"/>
        <rect x="61" y="45" width="6" height="26" rx="3" fill="#D5EF75"/>
        <text x="197" y="69" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="29">Pause</text>
      </g>
      <g transform="translate(348 0)">
        <rect width="322" height="116" rx="34" fill="#234E48" stroke="#557D75" stroke-width="2"/>
        <circle cx="58" cy="58" r="29" fill="#D5EF75"/>
        <path d="M47 53h10l12-10v30L57 63H47z" fill="none" stroke="#123C37" stroke-width="3" stroke-linejoin="round"/>
        <path d="M74 51c5 5 5 9 0 14" fill="none" stroke="#123C37" stroke-width="3" stroke-linecap="round"/>
        <text x="197" y="58" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="26">Voice</text>
        <text x="197" y="84" text-anchor="middle" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="19">On</text>
      </g>
      <g transform="translate(696 0)">
        <rect width="322" height="116" rx="34" fill="#234E48" stroke="#557D75" stroke-width="2"/>
        <circle cx="58" cy="58" r="29" fill="#D5EF75"/>
        <path d="M48 64c3-16 17-16 20 0M52 53c2-9 10-9 12 0" fill="none" stroke="#123C37" stroke-width="3" stroke-linecap="round"/>
        <text x="197" y="58" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="26">Haptics</text>
        <text x="197" y="84" text-anchor="middle" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="19">On</text>
      </g>
    </g>

    <g transform="translate(64 1130)">
      <circle cx="15" cy="14" r="7" fill="#82A49B"/>
      <text x="37" y="22" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Reduced motion follows your phone setting</text>
      <text x="1018" y="22" text-anchor="end" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Works offline</text>
    </g>
  </g>

  <!-- Encouragement -->
  <g transform="translate(72 1845)" filter="url(#s19shadow)">
    <rect width="1146" height="209" rx="38" fill="url(#s19mint)" stroke="#B9DCCB" stroke-width="3"/>
    <circle cx="82" cy="82" r="45" fill="#FFFDF7"/>
    <path d="M55 85c16-4 24-14 27-30 3 16 11 26 27 30-16 4-24 14-27 30-3-16-11-26-27-30z" fill="#D5EF75" stroke="#123C37" stroke-width="3" stroke-linejoin="round"/>
    <text x="151" y="69" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="34">The urge is a wave.</text>
    <text x="151" y="113" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="26">You can let it rise and pass without smoking.</text>
    <text x="151" y="157" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">You only need to stay with this breath—not solve the whole day.</text>
  </g>

  <!-- Alternate support -->
  <g transform="translate(72 2097)" filter="url(#s19shadow)">
    <rect width="1146" height="210" rx="38" fill="#FFFDF7"/>
    <text x="36" y="55" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="32">Need different support right now?</text>
    <text x="36" y="94" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">You can change tools without losing this check-in.</text>
    <g transform="translate(36 119)">
      <rect width="500" height="67" rx="29" fill="#EFF5F1" stroke="#C9DDD4" stroke-width="2"/>
      <path d="M32 34h22m-8-8 8 8-8 8" fill="none" stroke="#123C37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="270" y="44" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Switch coping tool</text>
    </g>
    <g transform="translate(572 119)">
      <rect width="538" height="67" rx="29" fill="#FFF0EB" stroke="#FFC6B7" stroke-width="2"/>
      <circle cx="35" cy="34" r="14" fill="#FF7D61"/>
      <circle cx="35" cy="30" r="4" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M28 42c2-6 12-6 14 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="286" y="44" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Get support from a person</text>
    </g>
  </g>

  <!-- Stop action and privacy -->
  <g transform="translate(72 2352)">
    <rect width="1146" height="104" rx="31" fill="none" stroke="#AFC6BD" stroke-width="3"/>
    <rect x="446" y="37" width="30" height="30" rx="5" fill="#FF7D61"/>
    <text x="600" y="67" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">End exercise</text>
  </g>

  <g transform="translate(72 2499)">
    <rect width="1146" height="91" rx="27" fill="#EFF5F1"/>
    <path d="M43 39h26v23H43zM49 39v-7c0-10 14-10 14 0v7" fill="none" stroke="#718A84" stroke-width="4" stroke-linecap="round"/>
    <text x="89" y="56" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">No data is being sent or shared during this exercise.</text>
    <text x="1095" y="56" text-anchor="end" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20">Content v1.0</text>
  </g>

  <text x="645" y="2661" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">After 2 minutes, you’ll rate the craving again</text>

  <!-- iOS home indicator -->
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
