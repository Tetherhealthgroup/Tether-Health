openapi: 3.1.0
info:
  title: Tether Health API
  version: 1.6.0
  description: >-
    Development contract for authenticated profiles and bounded program data.
    Real patient, clinical, and support-person data remain prohibited until
    privacy, clinical, retention, deletion, and compliance review is complete.
    Changed in 1.6.0: once account deletion has started, a consent grant
    that the database would otherwise record is refused with
    `account_deletion_in_progress` (a first grant or optional consent used
    to get `consent_not_permitted`). The API's own earlier checks still
    answer first, and for a first grant or optional consent so does
    `consent_document_unavailable`, because the database checks the
    document before the deletion barrier; a core re-consent that
    loses two races to a different live consent answers the new code
    `consent_conflict_retry`. Changed in 1.5.0 (breaking for the list response): `GET /v1/enrolments`
    returns `currentCoreConsentVersions` (one version per locale) instead of
    the single `currentCoreConsentVersion` string, which moved onto each
    enrolment. The API is pre-release and nothing consumed the old field.
servers:
  - url: https://api.example.invalid
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service readiness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /v1/profile:
    get:
      operationId: getMyProfile
      security: [{supabaseJwt: []}]
      responses:
        '200':
          description: Authenticated user's profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      operationId: updateMyProfile
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfile'}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '400': {description: Invalid request body}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/quit-plan:
    get:
      operationId: getMyQuitPlan
      security: [{supabaseJwt: []}]
      responses:
        '200':
          description: Authenticated user's complete quit-plan snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuitPlan'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: The authenticated user has not saved a quit plan}
        '502': {description: Quit-plan storage is temporarily unavailable}
    put:
      operationId: putMyQuitPlan
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutQuitPlan'}
      responses:
        '200':
          description: Replaced quit-plan snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuitPlan'}
        '400': {description: Invalid request body}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {description: Quit-plan storage is temporarily unavailable}
  /v1/quit-plan/guest-import:
    post:
      operationId: createMyQuitPlanFromGuest
      description: Atomically creates the caller plan only when none exists.
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutQuitPlan'}
      responses:
        '201':
          description: Created quit-plan snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuitPlan'}
        '400': {description: Invalid request body}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: The authenticated user already has a quit plan}
        '502': {description: Quit-plan storage is temporarily unavailable}
  /v1/account/export:
    get:
      operationId: exportMyAppData
      description: >-
        Returns the bounded app-owned profile and optional quit-plan snapshot.
        Requires a timestamped Supabase JWT authentication method (amr) within the configured recent-auth window.
      security: [{supabaseJwt: []}]
      responses:
        '200':
          description: JSON account data export
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountDataExport'}
        '401': {description: Missing, invalid, or insufficiently recent authentication}
        '502': {description: Account data is temporarily unavailable}
  /v1/program-data/{programId}:
    parameters:
      - name: programId
        in: path
        required: true
        schema: {type: string, enum: [heartwise, steady, clearair]}
    get:
      operationId: getMyProgramData
      security: [{supabaseJwt: []}]
      responses:
        '200':
          description: Caller-owned module snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgramData'}
        '404': {description: No snapshot exists}
    put:
      operationId: putMyProgramData
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload, revision]
              properties:
                payload: {type: object}
                revision: {type: integer, minimum: 1, maximum: 2147483647}
      responses:
        '200':
          description: Replaced caller-owned snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgramData'}
        '400': {description: Invalid or over-32-KiB payload}
        '409': {description: Revision does not immediately follow the stored snapshot}
    delete:
      operationId: deleteMyProgramData
      security: [{supabaseJwt: []}]
      responses:
        '204': {description: Snapshot deleted}
  /v1/account/data:
    delete:
      operationId: deleteMyAppData
      description: >-
        Permanently deletes caller-owned profile, quit-plan, program, and avatar data,
        then deletes the authenticated caller's Supabase Auth identity through a
        server-only privileged operation.
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: {const: DELETE}
      responses:
        '200':
          description: App-owned data deletion receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountDeletionReceipt'}
        '400': {description: Exact explicit confirmation was not supplied}
        '401': {description: Missing, invalid, or insufficiently recent authentication}
        '502': {description: Deletion did not complete}
  /v1/catalogue/programmes:
    get:
      operationId: listProgrammes
      description: Programme reference data (no user data), ordered by code.
      security: [{supabaseJwt: []}]
      responses:
        '200':
          description: The programme catalogue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgrammeCatalogue'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {description: The catalogue is temporarily unavailable}
  /v1/enrolments:
    get:
      operationId: listMyEnrolments
      description: >-
        The caller's enrolments (including left ones) with each enrolment's
        live programme consents (revoked_at is null). Revoked consent history
        is not provided by this endpoint. Only the caller's own rows are
        visible (row-level security). If the full list cannot be returned the
        request fails with 502 rather than returning part of it. The current
        core consent version per locale comes from the database's consent
        documents (`current_consent_documents()`).
      security: [{supabaseJwt: []}]
      responses:
        '200':
          description: The caller's enrolments
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrolmentList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {description: 'Enrolment storage or the consent documents are temporarily unavailable, or the list could not be returned in full'}
    post:
      operationId: enrolInProgramme
      description: >-
        Creates the caller's single enrolment for a programme. Rejoining a left
        programme is a PATCH of the existing enrolment, never a second POST.
        At most two enrolments may be in focus.
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEnrolment'}
      responses:
        '201':
          description: Created enrolment (no consents yet)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrolment'}
        '400':
          description: Invalid body (no code), or `mode_not_allowed`
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/RequestRejected'}
                  - {$ref: '#/components/schemas/CodedRequestRejected'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: '`programme_not_found`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '409':
          description: '`already_enrolled`, `focus_cap_reached` or `account_deletion_in_progress`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '502': {description: Enrolment storage is temporarily unavailable}
  /v1/enrolments/{enrolmentId}:
    parameters:
      - name: enrolmentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateMyEnrolment
      description: >-
        Changes status and/or mode. Setting `left` keeps the enrolment and its
        data until "Delete now" or account deletion, and revokes every live
        consent except core. Changing `left` to another status rejoins on the
        same enrolment; optional consents must be granted again. This is for
        single changes; to move one programme out of focus and another in,
        use `POST /v1/enrolments/focus-swap`, which does both in one
        transaction.
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateEnrolment'}
      responses:
        '200':
          description: Updated enrolment with its consents
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrolment'}
        '400':
          description: Invalid body (no code), or `mode_not_allowed`
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/RequestRejected'}
                  - {$ref: '#/components/schemas/CodedRequestRejected'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: '`enrolment_not_found` (also for enrolments of other users)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '409':
          description: '`focus_cap_reached`, `enrolment_conflict` or `account_deletion_in_progress` (rejoin after account deletion started)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '502': {description: Enrolment storage or the consent documents are temporarily unavailable}
    delete:
      operationId: deleteMyEnrolmentNow
      summary: Delete the enrolment row, its consents and its cascaded sync data (not yet for app use)
      description: >-
        Not for app use yet. Permanently deletes the enrolment row, all of its
        programme consents (live and revoked), and rows in tables that
        reference the enrolment with on delete cascade (sync data tables once
        they reference enrolments). It does not delete older programme data
        stored per account (quit_plans, program_data); a later change removes
        that data too, and only then should the app offer this as "Delete
        now". Requires the exact confirmation and a recent sign-in, as account
        deletion does.
      x-app-use: false
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: {const: DELETE}
      responses:
        '204': {description: The enrolment row, its consents and its cascaded rows were deleted}
        '400':
          description: '`confirmation_required` (missing or wrong confirmation), or an invalid enrolment id or body (no code)'
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/RequestRejected'}
                  - {$ref: '#/components/schemas/CodedRequestRejected'}
        '401':
          description: Missing or invalid token (no code), or `recent_authentication_required`
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/RequestRejected'}
                  - {$ref: '#/components/schemas/CodedRequestRejected'}
        '404':
          description: '`enrolment_not_found` (also for enrolments of other users)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '502': {description: Deletion did not complete}
  /v1/enrolments/focus-swap:
    post:
      operationId: swapMyFocus
      description: >-
        Moves one of the caller's enrolments out of focus and another into
        focus in one database transaction (`swap_focus`): the demoted
        enrolment becomes `paused` (its data is kept) and the promoted one
        becomes `focus`. Either both change or neither does. The focus cap
        of two is checked inside the call. Everything else in the response
        is read before the swap and nothing is read after it, so a failed
        read cannot report a committed swap as failed. Single status changes stay on
        `PATCH /v1/enrolments/{enrolmentId}`.
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SwapFocus'}
      responses:
        '200':
          description: Both enrolments after the swap, with their live consents
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FocusSwap'}
        '400':
          description: Invalid body
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestRejected'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: '`enrolment_not_found`: either enrolment does not exist or is not the caller''s'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '409':
          description: >-
            `focus_swap_invalid` (the enrolment to demote is not in focus, the
            one to promote is already in focus, or both ids are the same),
            `enrolment_left` (the enrolment to promote has been left) or
            `focus_cap_reached`. Nothing was changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '502': {description: 'Enrolment storage is temporarily unavailable, or the database refused the swap for a reason the caller cannot fix'}
  /v1/enrolments/consents:
    post:
      operationId: grantProgrammeConsent
      description: >-
        Records a consent on one of the caller's enrolments for the consent
        document the app showed, named by `consentVersion` and `locale`. The
        database copies that document's text into the consent; the API never
        accepts consent text and never substitutes a version of its own. A
        version that is unknown, not yet in effect or retired for that
        purpose and locale is refused with `consent_document_unavailable`.
        Any purpose other than core needs the enrolment's live core consent.
        A second grant of the same purpose and recipient while one is live
        is refused with `consent_already_granted` (409) and the existing row
        is unchanged; for core this applies when the live core consent is
        for the same version and locale. Clients can treat it as already
        done. Two first grants of core racing each other (no core live
        before either) also answer the loser with `consent_already_granted`,
        whichever version it asked for; the winner's row is the live one.

        Core re-consent: a core grant on an enrolment whose live core
        consent is for another version or locale supersedes it in one
        transaction (`supersede_core_consent`). The new row is returned with
        `supersededId` set to the replaced row, which is kept as revoked
        history. Optional consents stay live (unless the database's
        documents mark the versions passed over as revoking them). The new
        version must be later than the live one, or the same version in
        another locale; otherwise `consent_version_unchanged` (409).

        Repeating a core re-consent (for example a double tap) has two
        possible answers, both meaning the consent is in place: if the
        first request finished before the repeat was received, the repeat
        is a grant of the live version and locale and gets
        `consent_already_granted` (409); if the repeat raced the first and
        lost, it is answered as the first's success (201) with the live row
        and its `supersededId`. If a different core consent became live
        meanwhile, the supersession is tried once more; if that also loses
        a race, the answer follows what is then live: 201 if it is the
        requested version and locale, `core_consent_required` if no core
        consent is live, otherwise `consent_conflict_retry` (409, nothing
        was written): read the enrolment again and decide whether to ask
        for re-consent.

        Once account deletion has started, a grant that would otherwise be
        recorded (one that reaches the database) is refused with
        `account_deletion_in_progress`. The API's earlier checks still answer
        first: `sharing_not_available`, `enrolment_left`,
        `consent_already_granted` and `core_consent_required`. For a first
        grant or optional consent, `consent_document_unavailable` (no
        grantable document) also answers before
        `account_deletion_in_progress`.

        The share purposes (share_care_team, share_caregiver) are refused
        with `sharing_not_available` (409) until care connections exist.
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantConsent'}
      responses:
        '201':
          description: >-
            Recorded consent, with `supersededId` set when it replaced a core
            consent (null otherwise)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrantedProgrammeConsent'}
        '400':
          description: Invalid body, including any `consentText` field
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestRejected'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: '`enrolment_not_found` (also for enrolments of other users)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '409':
          description: >-
            `sharing_not_available`, `enrolment_left`, `core_consent_required`,
            `consent_already_granted`, `account_deletion_in_progress` (account
            deletion has started), `consent_not_permitted` (the database
            refused the row for another reason, for example the enrolment was
            left or the core consent revoked meanwhile),
            `consent_document_unavailable` (no grantable document for that
            purpose, version and locale), and for core re-consent
            `consent_version_unchanged` (not later than the live version) or
            `consent_conflict_retry` (lost two races to a different live core
            consent; read the enrolment again)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '502': {description: 'Consent storage is temporarily unavailable, or the database refused the consent for a reason the caller cannot fix'}
  /v1/enrolments/consents/{consentId}:
    parameters:
      - name: consentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: revokeProgrammeConsent
      description: >-
        Revokes a live consent (the only permitted change). The database sets
        the revocation time. Revoking core revokes every live consent of the
        enrolment. A core consent that was superseded by a newer core
        consent which is still live is refused with `consent_superseded`
        (409) and nothing changes: the member's core consent is live under
        the newer id, so re-read the enrolment and revoke that id. The API
        never revokes a row other than the one named.
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revoked]
              properties:
                revoked: {const: true}
      responses:
        '200':
          description: Revoked consent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgrammeConsent'}
        '400':
          description: Invalid body or consent id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestRejected'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: '`consent_not_found` (also for consents of other users)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '409':
          description: '`consent_already_revoked`, or `consent_superseded` (a superseded core consent while its replacement is live)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodedRequestRejected'}
        '502': {description: Consent storage is temporarily unavailable}
components:
  securitySchemes:
    supabaseJwt: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Unauthorized: {description: Missing or invalid Supabase access token}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: {const: ok}
        service: {const: breathefree-api}
        version: {type: string}
    Profile:
      type: object
      additionalProperties: false
      required: [id, displayName, locale, timeZone, onboardingCompleted, avatarPath, avatarUrl, avatarUrlExpiresAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: [string, 'null'], maxLength: 80}
        locale: {type: string, enum: [en, es]}
        timeZone: {type: string, minLength: 1, maxLength: 64}
        onboardingCompleted: {type: boolean}
        avatarPath: {type: [string, 'null'], maxLength: 512}
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: Authenticated private URL valid for at most five minutes.
        avatarUrlExpiresAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UpdateProfile:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: [string, 'null'], maxLength: 80}
        locale: {type: string, enum: [en, es]}
        timeZone: {type: string, minLength: 1, maxLength: 64}
        onboardingCompleted: {type: boolean}
        avatarPath: {type: [string, 'null'], maxLength: 512}
    AccountDataExport:
      type: object
      additionalProperties: false
      required: [schemaVersion, generatedAt, profile, quitPlan, programData]
      properties:
        schemaVersion: {const: '1.0'}
        generatedAt: {type: string, format: date-time}
        profile: {$ref: '#/components/schemas/Profile'}
        quitPlan:
          oneOf:
            - {$ref: '#/components/schemas/QuitPlan'}
            - {type: 'null'}
        programData:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/ProgramData'}
    ProgramData:
      type: object
      additionalProperties: false
      required: [programId, payload, revision, updatedAt]
      properties:
        programId: {type: string, enum: [heartwise, steady, clearair]}
        payload:
          type: object
          description: Bounded to 32 KiB encoded JSON by API and database.
        revision: {type: integer, minimum: 1, maximum: 2147483647}
        updatedAt: {type: string, format: date-time}
    AccountDeletionReceipt:
      type: object
      additionalProperties: false
      required: [requestId, completedAt, deleted, authIdentityDeleted, authIdentityStatus]
      properties:
        requestId: {type: string, format: uuid}
        completedAt: {type: string, format: date-time}
        deleted:
          type: object
          additionalProperties: false
          required: [profiles, quitPlans, avatarObjects, programData]
          properties:
            profiles: {type: integer, minimum: 0, maximum: 1}
            quitPlans: {type: integer, minimum: 0, maximum: 1}
            avatarObjects: {type: integer, minimum: 0}
            programData: {type: integer, minimum: 0, maximum: 3}
        authIdentityDeleted: {const: true}
        authIdentityStatus: {const: deleted}
    SupportPerson:
      type: object
      additionalProperties: false
      required: [id, name, relationship, channel, checkIn, enabled]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9_-]{1,80}$'}
        name: {type: string, minLength: 1, maxLength: 80}
        relationship: {type: string, minLength: 1, maxLength: 80}
        channel: {type: string, enum: [text, call]}
        checkIn: {type: string, minLength: 1, maxLength: 160}
        enabled: {type: boolean}
    QuitPlanFields:
      type: object
      required:
        - dailyCigaretteUse
        - smokingTriggers
        - customSmokingTrigger
        - readinessPath
        - quitPlanPath
        - quitDate
        - quitDayCheckIn
        - quitReasons
        - customQuitReason
        - topQuitReason
        - supportPeople
        - preparationTasks
        - treatmentSupport
        - careTeamReminder
      properties:
        dailyCigaretteUse:
          type: [string, 'null']
          enum: [notEveryDay, tenOrFewer, elevenToTwenty, twentyOneToThirty, thirtyOneOrMore, null]
        smokingTriggers:
          type: array
          uniqueItems: true
          maxItems: 11
          items:
            type: string
            enum: [stress, afterMeals, driving, coffee, socialSettings, workBreaks, alcohol, boredom, morning, beforeBed, scrolling]
        customSmokingTrigger: {type: [string, 'null'], minLength: 1, maxLength: 120}
        readinessPath: {type: string, enum: [prepare, explore, connect]}
        quitPlanPath:
          type: string
          enum: [setQuitDate, quitToday, reduceGradually, exploreFirst]
          description: exploreFirst requires readinessPath explore.
        quitDate: {type: string, format: date}
        quitDayCheckIn: {type: boolean}
        quitReasons:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            type: string
            enum: [family, breatheEasier, improveHealth, saveMoney, control, future, custom]
        customQuitReason: {type: [string, 'null'], minLength: 1, maxLength: 160}
        topQuitReason:
          type: [string, 'null']
          enum: [family, breatheEasier, improveHealth, saveMoney, control, future, custom, null]
        supportPeople:
          type: array
          description: Support-person IDs must be unique within the plan.
          maxItems: 10
          items: {$ref: '#/components/schemas/SupportPerson'}
        preparationTasks:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            type: string
            enum: [removeSupplies, smokeFreeSpaces, stockAlternatives]
        treatmentSupport: {type: boolean}
        careTeamReminder: {type: boolean}
    PutQuitPlan:
      allOf:
        - {$ref: '#/components/schemas/QuitPlanFields'}
      unevaluatedProperties: false
    QuitPlan:
      allOf:
        - {$ref: '#/components/schemas/QuitPlanFields'}
        - type: object
          required: [userId, createdAt, updatedAt]
          properties:
            userId: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
      unevaluatedProperties: false
    RequestRejected:
      description: Error body. Never contains submitted values or health data.
      type: object
      additionalProperties: false
      required: [statusCode, error, requestId]
      properties:
        statusCode: {type: integer}
        error: {type: string, enum: [Request rejected, Service unavailable]}
        requestId: {type: string}
    CodedRequestRejected:
      description: Error body with a stable code naming the refused rule. Never contains submitted values or health data.
      type: object
      additionalProperties: false
      required: [statusCode, error, code, requestId]
      properties:
        statusCode: {type: integer}
        error: {const: Request rejected}
        code:
          type: string
          enum:
            - enrolment_not_found
            - already_enrolled
            - programme_not_found
            - mode_not_allowed
            - focus_cap_reached
            - enrolment_conflict
            - enrolment_left
            - account_deletion_in_progress
            - core_consent_required
            - consent_already_granted
            - consent_not_found
            - consent_already_revoked
            - consent_superseded
            - consent_not_permitted
            - consent_document_unavailable
            - consent_version_unchanged
            - consent_conflict_retry
            - focus_swap_invalid
            - sharing_not_available
            - confirmation_required
            - recent_authentication_required
        requestId: {type: string}
    Programme:
      type: object
      additionalProperties: false
      required: [code, slug, name, area, archetype, receivesResources]
      properties:
        code: {type: string, pattern: '^[a-z]{2}$'}
        slug: {type: string}
        name: {type: string}
        area: {type: string}
        archetype: {type: string}
        receivesResources:
          type: array
          description: Record categories the programme may receive; empty means never.
          items: {type: string}
    ProgrammeCatalogue:
      type: object
      additionalProperties: false
      required: [programmes]
      properties:
        programmes:
          type: array
          items: {$ref: '#/components/schemas/Programme'}
    EnrolmentStatus: {type: string, enum: [focus, learn_only, paused, left]}
    EnrolmentMode:
      type: [string, 'null']
      enum: [quit, reduce, null]
      description: Only BreatheFree (bf) and ScrollFree (sf) take a mode.
    CreateEnrolment:
      type: object
      additionalProperties: false
      required: [programmeCode, status]
      properties:
        programmeCode: {type: string, pattern: '^[a-z]{2}$'}
        status: {type: string, enum: [focus, learn_only, paused]}
        mode: {$ref: '#/components/schemas/EnrolmentMode'}
    UpdateEnrolment:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: {$ref: '#/components/schemas/EnrolmentStatus'}
        mode: {$ref: '#/components/schemas/EnrolmentMode'}
    ConsentPurpose:
      type: string
      enum: [core, reminders, records_import, share_care_team, share_caregiver, research, screen_time]
    ConsentLocale: {type: string, enum: [en, es]}
    GrantConsent:
      type: object
      additionalProperties: false
      required: [enrolmentId, purpose, consentVersion, locale]
      properties:
        enrolmentId: {type: string, format: uuid}
        purpose: {$ref: '#/components/schemas/ConsentPurpose'}
        recipientRef:
          type: string
          format: uuid
          description: >-
            Care connection or caregiver id for share purposes only. Share
            purposes are not accepted yet, so any value is currently refused.
        consentVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$'
          description: The version of the consent document the app showed.
        locale:
          $ref: '#/components/schemas/ConsentLocale'
          description: The locale of the consent document the app showed.
    ProgrammeConsentFields:
      type: object
      required: [id, enrolmentId, purpose, recipientRef, consentVersion, locale, consentText, grantedAt, revokedAt]
      properties:
        id: {type: string, format: uuid}
        enrolmentId: {type: string, format: uuid}
        purpose: {$ref: '#/components/schemas/ConsentPurpose'}
        recipientRef: {type: [string, 'null']}
        consentVersion: {type: string}
        locale:
          type: [string, 'null']
          enum: [en, es, null]
          description: Null only on consents stored before consent documents existed.
        consentText:
          type: string
          description: The text of the consent document, as the database stored it with the consent.
        grantedAt: {type: string, format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
    ProgrammeConsent:
      allOf:
        - {$ref: '#/components/schemas/ProgrammeConsentFields'}
      unevaluatedProperties: false
    GrantedProgrammeConsent:
      allOf:
        - {$ref: '#/components/schemas/ProgrammeConsentFields'}
        - type: object
          required: [supersededId]
          properties:
            supersededId:
              type: [string, 'null']
              format: uuid
              description: >-
                The core consent this grant superseded (now revoked history);
                null when nothing was superseded.
      unevaluatedProperties: false
    SwapFocus:
      type: object
      additionalProperties: false
      required: [demoteId, promoteId]
      properties:
        demoteId: {type: string, format: uuid, description: The enrolment leaving focus; it becomes paused.}
        promoteId: {type: string, format: uuid, description: The enrolment entering focus.}
    FocusSwap:
      type: object
      additionalProperties: false
      required: [demoted, promoted]
      properties:
        demoted: {$ref: '#/components/schemas/Enrolment'}
        promoted: {$ref: '#/components/schemas/Enrolment'}
    Enrolment:
      type: object
      additionalProperties: false
      required: [id, programmeCode, status, mode, joinedAt, leftAt, createdAt, updatedAt, consents, currentCoreConsentVersion, reconsentRequired]
      properties:
        id: {type: string, format: uuid}
        programmeCode: {type: string, pattern: '^[a-z]{2}$'}
        status: {$ref: '#/components/schemas/EnrolmentStatus'}
        mode: {$ref: '#/components/schemas/EnrolmentMode'}
        joinedAt: {type: string, format: date-time}
        leftAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        consents:
          type: array
          description: >-
            Live consents of this enrolment (revoked_at is null), oldest
            first. Revoked history is not included.
          items: {$ref: '#/components/schemas/ProgrammeConsent'}
        currentCoreConsentVersion:
          type: [string, 'null']
          description: >-
            The current core consent document version for the locale of the
            live core consent; for a live core consent stored before consent
            documents existed (no locale), for the member's profile locale.
            Null when there is no live core consent, or when no core document
            is current for that locale.
        reconsentRequired:
          type: boolean
          description: >-
            True only when re-consent can be completed: the enrolment is not
            left, has a live core consent, `currentCoreConsentVersion` is not
            null, and the live consent is not on it. A live core consent
            stored before consent documents existed (no locale) is never on a
            document, so it is true whenever a core document is current for
            the member's profile locale.
    CoreConsentVersions:
      type: object
      additionalProperties: false
      required: [en, es]
      description: The current core consent document version per locale; null when none is current.
      properties:
        en: {type: [string, 'null']}
        es: {type: [string, 'null']}
    EnrolmentList:
      type: object
      additionalProperties: false
      required: [currentCoreConsentVersions, enrolments]
      properties:
        currentCoreConsentVersions: {$ref: '#/components/schemas/CoreConsentVersions'}
        enrolments:
          type: array
          items: {$ref: '#/components/schemas/Enrolment'}
