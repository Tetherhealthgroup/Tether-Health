  /v1/records/check-ins:
    post:
      operationId: recordCheckIn
      summary: Daily check-in
      description: >-
        Writes one `checkin` programme entry per enrolment that is in focus
        and holds a live core consent: each row holds `feel` and `stress`
        and only its own programme's answer (`answers.bf` only in the
        BreatheFree row, `answers.sf` only in the ScrollFree row). A
        programme whose row would hold nothing gets no row. One bulk
        insert. A repeat of a stored submission compares the stored rows of
        enrolments that still qualify and inserts nothing new.
      x-app-use: true
      security: [{supabaseJwt: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckIn'}
      responses:
        '201':
          description: The check-in was written
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckInCreated'}
        '200':
          description: A repeat of a stored check-in with the same content; nothing was written
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckInReplayed'}
        '400': {$ref: '#/components/responses/RecordsBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: '`account_deletion_in_progress`, `no_focus_programme` (no enrolment in focus with a live core consent), `idempotency_key_conflict`, or `record_not_allowed` (an enrolment was left, its consent revoked or account deletion started while the request ran). Nothing was written.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordsRequestRejected'}
        '413': {$ref: '#/components/responses/ProgrammeRecordTooLarge'}
        '415': {$ref: '#/components/responses/ProgrammeRecordUnsupportedMediaType'}
        '422': {$ref: '#/components/responses/RecordsInvalidRecord'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
        '502': {$ref: '#/components/responses/ProgrammeRecordUnavailable'}
  /v1/records/rescues:
    post:
      operationId: recordRescue
      summary: Rescue tool used
      description: >-
        `programme: "bf"` writes the rescue into the caller's BreatheFree
        enrolment after its checks; when it has none, has left, has no live
        core consent or account deletion has started, the rescue is refused
        and nothing is written (never stored as a shared rescue). Without
        `programme` the rescue is shared (no enrolment); the programme is
        never inferred. A repeat compares every field except `openedAt`.
      x-app-use: true
      security: [{supabaseJwt: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Rescue'}
      responses:
        '201': {$ref: '#/components/responses/ProgrammeRecordCreated'}
        '200': {$ref: '#/components/responses/ProgrammeRecordReplayed'}
        '400': {$ref: '#/components/responses/RecordsBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/RecordsNotEnrolled'}
        '409': {$ref: '#/components/responses/RecordsConflict'}
        '413': {$ref: '#/components/responses/ProgrammeRecordTooLarge'}
        '415': {$ref: '#/components/responses/ProgrammeRecordUnsupportedMediaType'}
        '422': {$ref: '#/components/responses/RecordsInvalidRecord'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
        '502': {$ref: '#/components/responses/ProgrammeRecordUnavailable'}
  /v1/records/lessons:
    post:
      operationId: recordLesson
      summary: Lesson completed
      description: >-
        Records a completed lesson in the caller's enrolment in
        `programme`. The lesson is the identity: completing it again
        answers 200 `replayed` whatever the key. The key is still required.
