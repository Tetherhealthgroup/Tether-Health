        '200': {$ref: '#/components/responses/ProgrammeRecordReplayed'}
        '400': {$ref: '#/components/responses/RecordsBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/RecordsNotEnrolled'}
        '409': {$ref: '#/components/responses/RecordsConflict'}
        '413': {$ref: '#/components/responses/ProgrammeRecordTooLarge'}
        '415': {$ref: '#/components/responses/ProgrammeRecordUnsupportedMediaType'}
        '422': {$ref: '#/components/responses/RecordsInvalidRecord'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
        '502': {$ref: '#/components/responses/ProgrammeRecordUnavailable'}
  /v1/today:
    get:
      operationId: getToday
      summary: The member's day
      description: >-
        The day in the member's time zone (UTC when none is set or the zone
        is unknown): whether a check-in happened today, the newest shared
        rescue that helped ("Yes" or "A little"), and one block per
        enrolment that is not left, each built only from that programme's
        own rows. Lapse counts and times come from the synced lapses of
        that programme; nothing else of the synced data is read. "Last 7
        days" is today and the six local days before it.
      x-app-use: true
      security: [{supabaseJwt: []}]
      responses:
        '200':
          description: The member's day
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Today'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
        '502': {$ref: '#/components/responses/ProgrammeRecordUnavailable'}
  /v1/records/summary:
    get:
      operationId: getRecordsSummary
      summary: One programme's records
      description: >-
        One programme per call: its observations, entries and lessons from
        the last `days` days, its lapses (bf, sf) and its rescues (bf
        only). A programme the member left is summarised too (its data is
        kept until deleted).
      x-app-use: true
      security: [{supabaseJwt: []}]
      parameters:
        - {name: programme, in: query, required: true, schema: {type: string, pattern: '^[a-z]{2}$'}}
        - {name: days, in: query, required: true, schema: {type: integer, enum: [7, 30, 90]}}
      responses:
        '200':
          description: The programme's records
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordsSummary'}
        '400':
          description: '`invalid_request`: a missing, repeated, unknown or invalid query parameter'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordsRequestRejected'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/RecordsNotEnrolled'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
        '502': {$ref: '#/components/responses/ProgrammeRecordUnavailable'}
  /v1/notifications/preferences:
    get:
      operationId: getNotificationPreferences
      summary: Notification preferences
      description: >-
        The stored switches and reminder times. A member who never saved
        gets the stored defaults with `persisted: false`: check-ins and plan
        reminders off, sensitive details off, quiet hours on.
      x-app-use: true
      security: [{supabaseJwt: []}]
      responses:
        '200':
          description: The member's notification preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPreferences'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
        '502': {$ref: '#/components/responses/ProgrammeRecordUnavailable'}
    patch:
      operationId: updateNotificationPreferences
      summary: Change notification preferences
      description: >-
        Changes only the fields present (last write wins). Each reminder is
        stored for the caller's enrolment in its programme, which must not
        be left and must hold a live core consent; a reminder time can be
        changed but not cleared. Storing a time sends nothing: whether a
        reminder fires is the programme's reminders consent. An
        `Idempotency-Key` header is accepted and ignored. Answers the state
        after the change.
      x-app-use: true
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchNotificationPreferences'}
      responses:
        '200':
          description: The member's notification preferences after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPreferences'}
        '400': {$ref: '#/components/responses/RecordsBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/RecordsNotEnrolled'}
        '409': {$ref: '#/components/responses/RecordsConflict'}
        '413': {$ref: '#/components/responses/ProgrammeRecordTooLarge'}
        '415': {$ref: '#/components/responses/ProgrammeRecordUnsupportedMediaType'}
        '422': {$ref: '#/components/responses/RecordsInvalidRecord'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
        '502': {$ref: '#/components/responses/ProgrammeRecordUnavailable'}
  /v1/profile/baseline:
    get:
      operationId: getWellbeingBaseline
      summary: Onboarding baseline
      description: The member's age band, sleep band and stress band, each null when not given. Kept apart from the identity profile; never shared.
      x-app-use: true
      security: [{supabaseJwt: []}]
      responses:
        '200':
          description: The member's baseline
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Baseline'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
        '502': {$ref: '#/components/responses/ProgrammeRecordUnavailable'}
    put:
      operationId: putWellbeingBaseline
      summary: Replace the onboarding baseline
      description: Replaces all three values; a field that is absent or null is stored as null. Answers the stored baseline.
      x-app-use: true
      security: [{supabaseJwt: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutBaseline'}
      responses:
        '200':
          description: The stored baseline
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Baseline'}
        '400': {$ref: '#/components/responses/RecordsBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/RecordsConflict'}
        '413': {$ref: '#/components/responses/ProgrammeRecordTooLarge'}
        '415': {$ref: '#/components/responses/ProgrammeRecordUnsupportedMediaType'}
        '422': {$ref: '#/components/responses/RecordsInvalidRecord'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
        '502': {$ref: '#/components/responses/ProgrammeRecordUnavailable'}
  /v1/app/config:
    get:
      operationId: getAppConfig
      summary: App configuration
      description: Public. The lowest app version the API serves, per platform (0.0.0 asks no version to update). Nothing else.
      x-app-use: true
      security: []
      responses:
        '200':
          description: The app configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppConfig'}
        '429': {$ref: '#/components/responses/ProgrammeRecordRateLimited'}
components:
  securitySchemes:
    supabaseJwt: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required. 32 lowercase hex characters (the app's form) or a canonical
        UUID; the same 128-bit value becomes the submission id. A repeat with
        the same key and the same content answers 200 `replayed` and writes
        nothing; times (`occurredAt`, `measuredAt`, `checkedAt`, `labDate`)
        are not compared, so the first stored time wins. The same key with
        other content answers 409 `idempotency_key_conflict`. Missing: 400
        `idempotency_key_required`; any other form: 400
        `idempotency_key_invalid`. Checked after authentication and before
        the body.
      schema:
        type: string
        pattern: '^([0-9a-f]{32}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
  responses:
    Unauthorized: {description: Missing or invalid Supabase access token}
    ProgrammeRecordCreated:
      description: The submission was written (at least one of its rows is new)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProgrammeRecordCreated'}
    ProgrammeRecordReplayed:
      description: A repeat of a stored submission with the same content; nothing was written
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProgrammeRecordReplayed'}
    ProgrammeRecordBadRequest:
      description: >-
        `idempotency_key_required`, `idempotency_key_invalid`, or
        `invalid_request` (an unknown key, including `constructor` and
        `prototype`, a missing required field, a value of the wrong type, an
        option not in the list, more than 3 decimal places, a fraction in an
        integer field, a time more than 5 minutes ahead, or a date outside
        its bounds). The key is checked before the body. A body the JSON
        parser refuses before the route runs (malformed JSON, or a
        `__proto__` key or `constructor.prototype` anywhere in it) gets the
        generic body without a code (`RequestRejected`). Nothing was written.
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/ProgrammeDataRequestRejected'}
              - {$ref: '#/components/schemas/RequestRejected'}
    ProgrammeRecordTooLarge:
      description: The body is larger than the server's request body limit (generic body, no code); nothing was written
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RequestRejected'}
    ProgrammeRecordUnsupportedMediaType:
      description: The body is not `application/json` (generic body, no code); nothing was written
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RequestRejected'}
    ProgrammeRecordRateLimited:
      description: Too many requests from this client (generic body, no code); nothing was written
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RequestRejected'}
    ProgrammeRecordNotEnrolled:
      description: '`enrolment_not_found`: the caller has no enrolment in this programme (also when it was deleted meanwhile); nothing was written'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProgrammeDataRequestRejected'}
    ProgrammeRecordConflict:
      description: '`account_deletion_in_progress`, `enrolment_left`, `core_consent_required` (no live core consent), `idempotency_key_conflict` (the key was used with other content), or `record_not_allowed` (the enrolment was left, its consent revoked or account deletion started while the request ran). Nothing was written, except that a zone check whose entry was written before its peak flow conflicted keeps the entry.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProgrammeDataRequestRejected'}
    ProgrammeRecordUnavailable:
      description: Record storage is temporarily unavailable, or the database refused the record for a reason the caller cannot fix
    RecordsBadRequest:
      description: >-
        `idempotency_key_required` or `idempotency_key_invalid` (POST
        routes; checked before the body), or `invalid_request` (an unknown
        key, a missing required field, a value of the wrong type, a code
        not in its list, a time more than 5 minutes ahead, a check-in with
        no value, or a lesson id without its programme's prefix). A body
        the JSON parser refuses gets the generic body without a code
        (`RequestRejected`). Nothing was written.
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/RecordsRequestRejected'}
              - {$ref: '#/components/schemas/RequestRejected'}
    RecordsNotEnrolled:
      description: '`enrolment_not_found`: the caller has no enrolment in this programme (also when it was deleted meanwhile); nothing was written'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecordsRequestRejected'}
    RecordsConflict:
      description: '`account_deletion_in_progress`, `enrolment_left`, `core_consent_required` (no live core consent), `idempotency_key_conflict` (the key was used with other content), or `record_not_allowed` (the enrolment was left, its consent revoked or account deletion started while the request ran). Nothing was written by the refused write.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecordsRequestRejected'}
    RecordsInvalidRecord:
      description: '`invalid_record`: the database refused the record''s shape or bounds, or a check-in answered for a programme that is not an enrolment in focus with a live core consent; nothing was written'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecordsRequestRejected'}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: {const: ok}
        service: {const: breathefree-api}
        version: {type: string}
    Profile:
      type: object
      additionalProperties: false
      required: [id, displayName, locale, timeZone, onboardingCompleted, avatarPath, avatarUrl, avatarUrlExpiresAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: [string, 'null'], maxLength: 80}
        locale: {type: string, enum: [en, es]}
        timeZone: {type: string, minLength: 1, maxLength: 64}
        onboardingCompleted: {type: boolean}
        avatarPath: {type: [string, 'null'], maxLength: 512}
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: Authenticated private URL valid for at most five minutes.
        avatarUrlExpiresAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UpdateProfile:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: [string, 'null'], maxLength: 80}
        locale: {type: string, enum: [en, es]}
        timeZone: {type: string, minLength: 1, maxLength: 64}
        onboardingCompleted: {type: boolean}
        avatarPath: {type: [string, 'null'], maxLength: 512}
    AccountDataExport:
      type: object
      additionalProperties: false
      required: [schemaVersion, generatedAt, profile, quitPlan, programData]
      properties:
        schemaVersion: {const: '1.0'}
        generatedAt: {type: string, format: date-time}
        profile: {$ref: '#/components/schemas/Profile'}
        quitPlan:
          oneOf:
            - {$ref: '#/components/schemas/QuitPlan'}
            - {type: 'null'}
        programData:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/ProgramData'}
    ProgramData:
      type: object
      additionalProperties: false
      required: [programId, payload, revision, updatedAt]
      properties:
        programId: {type: string, enum: [heartwise, steady, clearair]}
        payload:
          type: object
          description: Bounded to 32 KiB encoded JSON by API and database.
        revision: {type: integer, minimum: 1, maximum: 2147483647}
        updatedAt: {type: string, format: date-time}
    AccountDeletionReceipt:
      type: object
      additionalProperties: false
      required: [requestId, completedAt, deleted, authIdentityDeleted, authIdentityStatus]
      properties:
        requestId: {type: string, format: uuid}
        completedAt: {type: string, format: date-time}
        deleted:
          type: object
          additionalProperties: false
          required: [profiles, quitPlans, avatarObjects, programData]
          properties:
            profiles: {type: integer, minimum: 0, maximum: 1}
            quitPlans: {type: integer, minimum: 0, maximum: 1}
            avatarObjects: {type: integer, minimum: 0}
            programData: {type: integer, minimum: 0, maximum: 3}
        authIdentityDeleted: {const: true}
        authIdentityStatus: {const: deleted}
    SupportPerson:
      type: object
      additionalProperties: false
      required: [id, name, relationship, channel, checkIn, enabled]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9_-]{1,80}$'}
        name: {type: string, minLength: 1, maxLength: 80}
        relationship: {type: string, minLength: 1, maxLength: 80}
        channel: {type: string, enum: [text, call]}
        checkIn: {type: string, minLength: 1, maxLength: 160}
        enabled: {type: boolean}
    QuitPlanFields:
      type: object
      required:
        - dailyCigaretteUse
        - smokingTriggers
        - customSmokingTrigger
        - readinessPath
        - quitPlanPath
        - quitDate
        - quitDayCheckIn
        - quitReasons
        - customQuitReason
        - topQuitReason
        - supportPeople
        - preparationTasks
        - treatmentSupport
        - careTeamReminder
      properties:
        dailyCigaretteUse:
          type: [string, 'null']
          enum: [notEveryDay, tenOrFewer, elevenToTwenty, twentyOneToThirty, thirtyOneOrMore, null]
        smokingTriggers:
          type: array
          uniqueItems: true
          maxItems: 11
          items:
            type: string
            enum: [stress, afterMeals, driving, coffee, socialSettings, workBreaks, alcohol, boredom, morning, beforeBed, scrolling]
        customSmokingTrigger: {type: [string, 'null'], minLength: 1, maxLength: 120}
        readinessPath: {type: string, enum: [prepare, explore, connect]}
        quitPlanPath:
          type: string
          enum: [setQuitDate, quitToday, reduceGradually, exploreFirst]
          description: exploreFirst requires readinessPath explore.
        quitDate: {type: string, format: date}
        quitDayCheckIn: {type: boolean}
        quitReasons:
          type: array
          uniqueItems: true
          maxItems: 7
          items:
            type: string
            enum: [family, breatheEasier, improveHealth, saveMoney, control, future, custom]
        customQuitReason: {type: [string, 'null'], minLength: 1, maxLength: 160}
        topQuitReason:
          type: [string, 'null']
          enum: [family, breatheEasier, improveHealth, saveMoney, control, future, custom, null]
        supportPeople:
          type: array
          description: Support-person IDs must be unique within the plan.
          maxItems: 10
          items: {$ref: '#/components/schemas/SupportPerson'}
        preparationTasks:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            type: string
            enum: [removeSupplies, smokeFreeSpaces, stockAlternatives]
        treatmentSupport: {type: boolean}
        careTeamReminder: {type: boolean}
    PutQuitPlan:
      allOf:
        - {$ref: '#/components/schemas/QuitPlanFields'}
      unevaluatedProperties: false
    QuitPlan:
      allOf:
        - {$ref: '#/components/schemas/QuitPlanFields'}
        - type: object
          required: [userId, createdAt, updatedAt]
          properties:
            userId: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
      unevaluatedProperties: false
    RequestRejected:
      description: Error body. Never contains submitted values or health data.
      type: object
      additionalProperties: false
      required: [statusCode, error, requestId]
      properties:
        statusCode: {type: integer}
        error: {type: string, enum: [Request rejected, Service unavailable]}
        requestId: {type: string}
    CodedRequestRejected:
      description: Error body with a stable code naming the refused rule. Never contains submitted values or health data.
      type: object
      additionalProperties: false
      required: [statusCode, error, code, requestId]
      properties:
        statusCode: {type: integer}
        error: {const: Request rejected}
        code:
          type: string
          enum:
            - enrolment_not_found
            - already_enrolled
            - programme_not_found
            - mode_not_allowed
            - focus_cap_reached
            - enrolment_conflict
            - enrolment_left
            - account_deletion_in_progress
            - core_consent_required
            - consent_already_granted
            - consent_not_found
            - consent_already_revoked
            - consent_superseded
            - consent_not_permitted
            - consent_document_unavailable
            - consent_version_unchanged
            - consent_conflict_retry
            - focus_swap_invalid
            - sharing_not_available
            - confirmation_required
            - recent_authentication_required
        requestId: {type: string}
    Programme:
      type: object
      additionalProperties: false
      required: [code, slug, name, area, archetype, receivesResources]
      properties:
        code: {type: string, pattern: '^[a-z]{2}$'}
        slug: {type: string}
        name: {type: string}
        area: {type: string}
        archetype: {type: string}
        receivesResources:
          type: array
          description: Record categories the programme may receive; empty means never.
          items: {type: string}
    ProgrammeCatalogue:
      type: object
      additionalProperties: false
      required: [programmes]
      properties:
        programmes:
          type: array
          items: {$ref: '#/components/schemas/Programme'}
    EnrolmentStatus: {type: string, enum: [focus, learn_only, paused, left]}
    EnrolmentMode:
      type: [string, 'null']
      enum: [quit, reduce, null]
      description: Only BreatheFree (bf) and ScrollFree (sf) take a mode.
    CreateEnrolment:
      type: object
      additionalProperties: false
      required: [programmeCode, status]
      properties:
        programmeCode: {type: string, pattern: '^[a-z]{2}$'}
        status: {type: string, enum: [focus, learn_only, paused]}
        mode: {$ref: '#/components/schemas/EnrolmentMode'}
    UpdateEnrolment:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: {$ref: '#/components/schemas/EnrolmentStatus'}
        mode: {$ref: '#/components/schemas/EnrolmentMode'}
    ConsentPurpose:
      type: string
      enum: [core, reminders, records_import, share_care_team, share_caregiver, research, screen_time]
    ConsentLocale: {type: string, enum: [en, es]}
    GrantConsent:
      type: object
      additionalProperties: false
      required: [enrolmentId, purpose, consentVersion, locale]
      properties:
        enrolmentId: {type: string, format: uuid}
        purpose: {$ref: '#/components/schemas/ConsentPurpose'}
        recipientRef:
          type: string
          format: uuid
          description: >-
            Care connection or caregiver id for share purposes only. Share
            purposes are not accepted yet, so any value is currently refused.
        consentVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$'
          description: The version of the consent document the app showed.
        locale:
          $ref: '#/components/schemas/ConsentLocale'
          description: The locale of the consent document the app showed.
    ProgrammeConsentFields:
      type: object
      required: [id, enrolmentId, purpose, recipientRef, consentVersion, locale, consentText, grantedAt, revokedAt]
      properties:
        id: {type: string, format: uuid}
        enrolmentId: {type: string, format: uuid}
        purpose: {$ref: '#/components/schemas/ConsentPurpose'}
        recipientRef: {type: [string, 'null']}
        consentVersion: {type: string}
        locale:
          type: [string, 'null']
          enum: [en, es, null]
          description: Null only on consents stored before consent documents existed.
        consentText:
          type: string
          description: The text of the consent document, as the database stored it with the consent.
        grantedAt: {type: string, format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
    ProgrammeConsent:
      allOf:
        - {$ref: '#/components/schemas/ProgrammeConsentFields'}
      unevaluatedProperties: false
    GrantedProgrammeConsent:
      allOf:
        - {$ref: '#/components/schemas/ProgrammeConsentFields'}
        - type: object
          required: [supersededId]
          properties:
            supersededId:
              type: [string, 'null']
              format: uuid
              description: >-
                The core consent this grant superseded (now revoked history);
                null when nothing was superseded.
      unevaluatedProperties: false
    SwapFocus:
      type: object
      additionalProperties: false
      required: [demoteId, promoteId]
      properties:
        demoteId: {type: string, format: uuid, description: The enrolment leaving focus; it becomes paused.}
        promoteId: {type: string, format: uuid, description: The enrolment entering focus.}
    FocusSwap:
      type: object
      additionalProperties: false
      required: [demoted, promoted]
      properties:
        demoted: {$ref: '#/components/schemas/Enrolment'}
        promoted: {$ref: '#/components/schemas/Enrolment'}
    Enrolment:
      type: object
      additionalProperties: false
      required: [id, programmeCode, status, mode, joinedAt, leftAt, createdAt, updatedAt, consents, currentCoreConsentVersion, reconsentRequired]
      properties:
        id: {type: string, format: uuid}
        programmeCode: {type: string, pattern: '^[a-z]{2}$'}
        status: {$ref: '#/components/schemas/EnrolmentStatus'}
        mode: {$ref: '#/components/schemas/EnrolmentMode'}
        joinedAt: {type: string, format: date-time}
        leftAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        consents:
          type: array
          description: >-
            Live consents of this enrolment (revoked_at is null), oldest
            first. Revoked history is not included.
          items: {$ref: '#/components/schemas/ProgrammeConsent'}
        currentCoreConsentVersion:
          type: [string, 'null']
          description: >-
            The current core consent document version for the locale of the
            live core consent; for a live core consent stored before consent
            documents existed (no locale), for the member's profile locale.
            Null when there is no live core consent, or when no core document
            is current for that locale.
        reconsentRequired:
          type: boolean
          description: >-
            True only when re-consent can be completed: the enrolment is not
            left, has a live core consent, `currentCoreConsentVersion` is not
            null, and the live consent is not on it. A live core consent
            stored before consent documents existed (no locale) is never on a
            document, so it is true whenever a core document is current for
            the member's profile locale.
    CoreConsentVersions:
      type: object
      additionalProperties: false
      required: [en, es]
      description: The current core consent document version per locale; null when none is current.
      properties:
        en: {type: [string, 'null']}
        es: {type: [string, 'null']}
    EnrolmentList:
      type: object
      additionalProperties: false
      required: [currentCoreConsentVersions, enrolments]
      properties:
        currentCoreConsentVersions: {$ref: '#/components/schemas/CoreConsentVersions'}
        enrolments:
          type: array
          items: {$ref: '#/components/schemas/Enrolment'}
    ProgrammeRecordCreated:
      description: The submission was written.
      type: object
      additionalProperties: false
      required: [submissionId]
      properties:
        submissionId: {type: string, format: uuid, description: 'The Idempotency-Key as a UUID'}
    ProgrammeRecordReplayed:
      description: Every row of the submission was already stored with the same content; nothing new was written.
      type: object
      additionalProperties: false
      required: [submissionId, replayed]
      properties:
        submissionId: {type: string, format: uuid}
        replayed: {const: true}
    ProgrammeDataRequestRejected:
      description: Error body of the programme event routes, with a stable code naming the refused rule. Never contains submitted values, field contents or identifiers.
      type: object
      additionalProperties: false
      required: [statusCode, error, code, requestId]
      properties:
        statusCode: {type: integer}
        error: {const: Request rejected}
        code:
          type: string
          enum:
            - invalid_request
            - idempotency_key_required
            - idempotency_key_invalid
            - idempotency_key_conflict
            - value_out_of_range
            - invalid_record
            - enrolment_not_found
            - enrolment_left
            - core_consent_required
            - account_deletion_in_progress
            - record_not_allowed
        requestId: {type: string}
    ProgrammeEventTime:
      type: string
      format: date-time
      description: RFC 3339 with an offset, at most 5 minutes in the future (otherwise 400 `invalid_request`). Optional; the default is the server's time of the request.
    ProgrammeRecordDate:
      type: string
      format: date
      description: A YYYY-MM-DD date from 1900-01-01 up to tomorrow's UTC date (otherwise 400 `invalid_request`). A lab date is stored as that date at 00:00:00Z.
    ProgrammeMeasurement:
      type: number
      minimum: 0
      maximum: 10000
      multipleOf: 0.001
      description: At most 3 decimal places (more is 400 `invalid_request`, never rounded). Outside 0 to 10000 the record is refused with 422 `invalid_record`.
    SubmitHwReadings:
      type: object
      additionalProperties: false
      required: [systolic, diastolic]
      properties:
        systolic: {type: integer, minimum: 70, maximum: 250, description: 'Spec rule hw.bp; outside answers 422 value_out_of_range'}
        diastolic: {type: integer, minimum: 40, maximum: 150, description: 'Spec rule hw.bp; outside answers 422 value_out_of_range'}
        pulse: {type: integer, minimum: 0, maximum: 10000}
        measuredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitHwLipids:
      type: object
      additionalProperties: false
      required: [labDate]
      anyOf:
        - {required: [total], properties: {total: true}}
        - {required: [ldl], properties: {ldl: true}}
        - {required: [hdl], properties: {hdl: true}}
        - {required: [triglycerides], properties: {triglycerides: true}}
      properties:
        total: {$ref: '#/components/schemas/ProgrammeMeasurement'}
        ldl: {$ref: '#/components/schemas/ProgrammeMeasurement'}
        hdl: {$ref: '#/components/schemas/ProgrammeMeasurement'}
        triglycerides: {$ref: '#/components/schemas/ProgrammeMeasurement'}
        labDate: {$ref: '#/components/schemas/ProgrammeRecordDate'}
    SubmitStReadings:
      type: object
      additionalProperties: false
      required: [reading]
      properties:
        reading: {type: number, minimum: 20, maximum: 600, multipleOf: 0.001, description: 'Spec rule st.glucose; outside answers 422 value_out_of_range. At most 3 decimal places'}
        when: {enum: [fasting, before_meal, 2_h_after_meal, bedtime, other]}
        feelings: {type: array, maxItems: 12, uniqueItems: true, items: {enum: [fine, shaky, sweaty, tired, thirsty]}}
        note: {type: string, minLength: 1, maxLength: 500, description: Trimmed text}
        measuredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitStA1c:
      type: object
      additionalProperties: false
      required: [a1c, labDate]
      properties:
        a1c: {$ref: '#/components/schemas/ProgrammeMeasurement'}
        labDate: {$ref: '#/components/schemas/ProgrammeRecordDate'}
    SubmitReLabs:
      type: object
      additionalProperties: false
      required: [labDate]
      anyOf:
        - {required: [egfr], properties: {egfr: true}}
        - {required: [urineAcr], properties: {urineAcr: true}}
        - {required: [alt], properties: {alt: true}}
      properties:
        egfr: {$ref: '#/components/schemas/ProgrammeMeasurement'}
        urineAcr: {$ref: '#/components/schemas/ProgrammeMeasurement'}
        alt: {$ref: '#/components/schemas/ProgrammeMeasurement'}
        labDate: {$ref: '#/components/schemas/ProgrammeRecordDate'}
    SubmitCaZoneChecks:
      type: object
      additionalProperties: false
      required: [zone]
      properties:
        zone: {enum: [green, yellow, red]}
        symptoms: {type: array, maxItems: 12, uniqueItems: true, items: {enum: [coughing, wheezing, short_of_breath, chest_tightness, woke_at_night, can_t_speak_in_full_sentences]}}
        peakFlow: {type: number, minimum: 50, maximum: 900, multipleOf: 0.001, description: 'Spec rule ca.zone; outside answers 422 value_out_of_range. At most 3 decimal places'}
        checkedAt: {allOf: [{$ref: '#/components/schemas/ProgrammeEventTime'}], description: 'The time of the check, for both rows'}
    SubmitCaSymptoms:
      type: object
      additionalProperties: false
      required: [symptoms]
      properties:
        symptoms: {type: array, minItems: 1, maxItems: 12, uniqueItems: true, items: {enum: [coughing, wheezing, short_of_breath, chest_tightness, woke_at_night]}}
        severity: {enum: [mild, moderate, severe]}
        triggers: {type: array, maxItems: 12, uniqueItems: true, items: {enum: [cold_air, smoke, pollen, exercise, not_sure]}}
        note: {type: string, minLength: 1, maxLength: 500, description: Trimmed text}
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitEaMoods:
      type: object
      additionalProperties: false
      required: [mood]
      properties:
        mood: {enum: [very_low, low, okay, good, great]}
        topics: {type: array, maxItems: 12, uniqueItems: true, items: {enum: [work, money, family, health, lonely, sleep, thoughts_of_harming_myself, not_sure]}}
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitEaCheckBacks:
      type: object
      additionalProperties: false
      required: [change]
      properties:
        change: {enum: [worse, same, better]}
        reachedOut: {enum: [yes_i_have_an_appointment, not_yet, i_don_t_want_to]}
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitSdSessions:
      type: object
      additionalProperties: false
      properties:
        settings: {type: array, maxItems: 12, uniqueItems: true, items: {enum: [audio_on, large_text, captions]}}
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitSdFalls:
      type: object
      additionalProperties: false
      properties:
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitSfPauses:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {enum: [message_someone, bored, avoiding_something, can_t_sleep]}
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitCkDone:
      type: object
      additionalProperties: false
      required: [item, doneOn]
      properties:
        item: {type: string, pattern: '^[a-z0-9_]{1,40}$', description: 'A code; the spec has no option list yet'}
        doneOn: {$ref: '#/components/schemas/ProgrammeRecordDate'}
        place: {type: string, minLength: 1, maxLength: 500, description: Trimmed text}
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitBeDiary:
      type: object
      additionalProperties: false
      required: [fatigue]
      properties:
        fatigue: {type: integer, minimum: 0, maximum: 10}
        symptoms: {type: array, maxItems: 12, uniqueItems: true, items: {enum: [nausea, pain, mouth_sores, numbness, low_mood]}}
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    SubmitBeSurvivorship:
      type: object
      additionalProperties: false
      required: [feeling]
      properties:
        feeling: {enum: [hard, mixed, good]}
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    RecordsRequestRejected:
      description: Error body of the records, Today, notification preference and baseline routes, with a stable code naming the refused rule. The programme event routes' codes plus `no_focus_programme`. Never contains submitted values, field contents or identifiers.
      type: object
      additionalProperties: false
      required: [statusCode, error, code, requestId]
      properties:
        statusCode: {type: integer}
        error: {const: Request rejected}
        code:
          type: string
          enum:
            - invalid_request
            - idempotency_key_required
            - idempotency_key_invalid
            - idempotency_key_conflict
            - value_out_of_range
            - invalid_record
            - enrolment_not_found
            - enrolment_left
            - core_consent_required
            - account_deletion_in_progress
            - record_not_allowed
            - no_focus_programme
        requestId: {type: string}
    CheckIn:
      type: object
      additionalProperties: false
      description: At least one of `feel`, `stress` or an answer (otherwise 400 `invalid_request`). "Skip" means the key is omitted.
      properties:
        feel: {enum: [low, not_great, okay, good, great]}
        stress: {enum: [low, some, high]}
        answers:
          type: object
          additionalProperties: false
          properties:
            bf: {enum: [no, a_puff, one_or_more]}
            sf: {enum: [better, same, drained]}
        occurredAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
    CheckInCreated:
      type: object
      additionalProperties: false
      required: [submissionId, entries]
      properties:
        submissionId: {type: string, format: uuid}
        entries:
          type: array
          description: The programmes that hold a row of this check-in, sorted
          items: {type: string, pattern: '^[a-z]{2}$'}
    CheckInReplayed:
      type: object
      additionalProperties: false
      required: [submissionId, replayed, entries]
      properties:
        submissionId: {type: string, format: uuid}
        replayed: {const: true}
        entries:
          type: array
          items: {type: string, pattern: '^[a-z]{2}$'}
    Rescue:
      type: object
      additionalProperties: false
      required: [tool]
      properties:
        programme: {const: bf, description: 'BreatheFree only; absent means a shared rescue'}
        tool: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
        openedAt: {$ref: '#/components/schemas/ProgrammeEventTime'}
        intensityBefore: {type: integer, minimum: 0, maximum: 10}
        intensityAfter: {type: integer, minimum: 0, maximum: 10}
        helped: {enum: [yes, a_little, no], description: '"Not this time" is `no`'}
        escalated: {type: boolean, description: 'Default false'}
    Lesson:
      type: object
      additionalProperties: false
      required: [programme, lessonId]
      properties:
        programme: {type: string, pattern: '^[a-z]{2}$'}
        lessonId: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,79}$', description: 'Starts with `<programme>.`; the spec has no lesson ids yet'}
    TodayMeasurement:
      type: [object, 'null']
      additionalProperties: false
      required: [value, at]
      properties:
        value: {type: number}
        at: {type: string}
    TodayRescue:
      type: [object, 'null']
      additionalProperties: false
      required: [tool, at]
      properties:
        tool: {type: string}
        at: {type: string}
    TodayProgramme:
      type: object
      additionalProperties: false
      required: [code, status, mode, reminderAt, lessonsCompleted]
      description: Common fields, plus only the fixed fields of the block's own programme (hw lastBp; st lastGlucose, lastA1c; re lastLabs; ca lastZoneCheck; ea lastMood; sd sessionsLast7Days, lastFallAt; sf pausesToday, lapsesLast7Days; ck lastDone; be lastDiary; bf lapsesLast7Days, lastLapseAt, lastHelpfulRescue).
      properties:
        code: {type: string, pattern: '^[a-z]{2}$'}
        status: {enum: [focus, learn_only, paused]}
        mode: {enum: [quit, reduce, null]}
        reminderAt: {type: [string, 'null'], pattern: '^[0-9]{2}:[0-9]{2}$'}
        lessonsCompleted: {type: integer, minimum: 0}
        lastBp:
          type: [object, 'null']
          additionalProperties: false
          required: [systolic, diastolic, pulse, at]
          properties:
            systolic: {type: number}
            diastolic: {type: [number, 'null']}
            pulse: {type: [number, 'null']}
            at: {type: string}
        lastGlucose: {$ref: '#/components/schemas/TodayMeasurement'}
        lastA1c: {$ref: '#/components/schemas/TodayMeasurement'}
        lastLabs:
          type: object
          additionalProperties: false
          required: [egfr, urineAcr, alt]
          properties:
            egfr: {$ref: '#/components/schemas/TodayMeasurement'}
            urineAcr: {$ref: '#/components/schemas/TodayMeasurement'}
            alt: {$ref: '#/components/schemas/TodayMeasurement'}
        lastZoneCheck:
          type: [object, 'null']
          additionalProperties: false
          required: [zone, at]
          properties:
            zone: {type: string}
            at: {type: string}
        lastMood:
          type: [object, 'null']
          additionalProperties: false
          required: [mood, at]
          properties:
            mood: {type: string}
            at: {type: string}
        sessionsLast7Days: {type: integer, minimum: 0}
        lastFallAt: {type: [string, 'null']}
        pausesToday: {type: integer, minimum: 0}
        lapsesLast7Days: {type: integer, minimum: 0}
        lastLapseAt: {type: [string, 'null']}
        lastDone:
          type: [object, 'null']
          additionalProperties: false
          required: [item, doneOn, at]
          properties:
            item: {type: string}
            doneOn: {type: string, format: date}
            at: {type: string}
        lastDiary:
          type: [object, 'null']
          additionalProperties: false
          required: [fatigue, at]
          properties:
            fatigue: {type: integer, minimum: 0, maximum: 10}
            at: {type: string}
        lastHelpfulRescue: {$ref: '#/components/schemas/TodayRescue'}
    Today:
      type: object
      additionalProperties: false
      required: [date, checkin, account, programmes]
      properties:
        date: {type: string, format: date, description: "Today's date in the member's time zone"}
        checkin:
          type: object
          additionalProperties: false
          required: [doneToday]
          properties:
            doneToday: {type: boolean}
        account:
          type: object
          additionalProperties: false
          required: [lastHelpfulRescue]
          properties:
            lastHelpfulRescue: {$ref: '#/components/schemas/TodayRescue'}
        programmes:
          type: array
          items: {$ref: '#/components/schemas/TodayProgramme'}
    RecordsSummary:
      type: object
      additionalProperties: false
      required: [programme, days, since, status, observations, entries, lessons]
      properties:
        programme: {type: string, pattern: '^[a-z]{2}$'}
        days: {enum: [7, 30, 90]}
        since: {type: string, format: date-time}
        status: {enum: [focus, learn_only, paused, left]}
        observations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metric, value, unit, at, attributes]
            properties:
              metric: {type: string}
              value: {type: number}
              unit: {type: string}
              at: {type: string}
              attributes: {type: object}
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, at, payload]
            properties:
              kind: {type: string}
              at: {type: string}
              payload: {type: object}
        lessons:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [lessonId, completedAt]
            properties:
              lessonId: {type: string}
              completedAt: {type: string}
        lapses:
          type: array
          description: bf and sf only
          items:
            type: object
            additionalProperties: false
            required: [at]
            properties:
              at: {type: string}
        rescues:
          type: array
          description: bf only (its own rescues; shared rescues are not a programme's)
          items:
            type: object
            additionalProperties: false
            required: [tool, openedAt, intensityBefore, intensityAfter, helped, escalated]
            properties:
              tool: {type: string}
              openedAt: {type: string}
              intensityBefore: {type: [integer, 'null']}
              intensityAfter: {type: [integer, 'null']}
              helped: {enum: [yes, a_little, no, null]}
              escalated: {type: boolean}
    ProgrammeReminder:
      type: object
      additionalProperties: false
      required: [programme, remindAt]
      properties:
        programme: {type: string, pattern: '^[a-z]{2}$'}
        remindAt: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [remindersEnabled, sensitiveDetails, quietHoursEnabled, persisted, programmeReminders]
      properties:
        remindersEnabled: {type: boolean}
        sensitiveDetails: {type: boolean}
        quietHoursEnabled: {type: boolean}
        persisted: {type: boolean, description: 'False when the member never saved the switches (the values are the stored defaults)'}
        programmeReminders:
          type: array
          items: {$ref: '#/components/schemas/ProgrammeReminder'}
    PatchNotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        remindersEnabled: {type: boolean}
        sensitiveDetails: {type: boolean}
        quietHoursEnabled: {type: boolean}
        programmeReminders:
          type: array
          maxItems: 11
          description: Each programme at most once
          items: {$ref: '#/components/schemas/ProgrammeReminder'}
    Baseline:
      type: object
      additionalProperties: false
      required: [ageRange, sleepBand, stressBand]
      properties:
        ageRange: {enum: ['18_24', '25_34', '35_44', '45_54', '55_64', '65_74', '75_plus', null]}
        sleepBand: {enum: [lt5, '5_6', '7_8', '9plus', null]}
        stressBand: {enum: [low, some, high, null]}
    PutBaseline:
      type: object
      additionalProperties: false
      description: Absent or null stores null.
      properties:
        ageRange: {enum: ['18_24', '25_34', '35_44', '45_54', '55_64', '65_74', '75_plus', null], description: 'Age band; everyone 75 and over is 75_plus'}
        sleepBand: {enum: [lt5, '5_6', '7_8', '9plus', null], description: '"< 5 h", "5–6 h", "7–8 h", "9+ h"'}
        stressBand: {enum: [low, some, high, null]}
    AppConfig:
      type: object
      additionalProperties: false
      required: [minimumVersion]
      properties:
        minimumVersion:
          type: object
          additionalProperties: false
          required: [ios, android]
          properties:
            ios: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
            android: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
