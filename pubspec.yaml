name: breathefree_patient
description: BreatheFree smoking-cessation patient application — the approved 28-screen experience plus the Unplug v2.1 digital-wellbeing module (screens A–L).
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generates the Unplug channel contract (addendum §2.3) for Dart, Swift and
  # Kotlin from pigeons/unplug_api.dart. Regenerate with tool/generate_pigeon.sh
  # after any change to that file; never edit the generated sources by hand.
  pigeon: ^28.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/screens/
    - assets/unplug/
