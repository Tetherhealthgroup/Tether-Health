name: breathefree_patient
description: BreatheFree smoking-cessation patient application — complete approved 28-screen experience.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Drives the e2e tier in integration_test/ on a real device or emulator.
  # The widget tiers stub every platform channel; this one does not, which is
  # why it is the only tier that can catch a plugin or localizations failure
  # that appears solely under the real engine.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/screens/
