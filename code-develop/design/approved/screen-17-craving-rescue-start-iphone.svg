<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="s17bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="1" stop-color="#F5F2E8"/>
    </linearGradient>
    <linearGradient id="s17mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F5ED"/>
      <stop offset="1" stop-color="#C7E6D8"/>
    </linearGradient>
    <linearGradient id="s17hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123C37"/>
      <stop offset="1" stop-color="#1D514A"/>
    </linearGradient>
    <filter id="s17shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#123C37" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#s17bg)"/>

  <!-- iOS status bar -->
  <g fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700">
    <text x="74" y="76" font-size="36">9:41</text>
    <g transform="translate(1056 43)">
      <rect x="0" y="22" width="10" height="15" rx="3"/>
      <rect x="16" y="17" width="10" height="20" rx="3"/>
      <rect x="32" y="11" width="10" height="26" rx="3"/>
      <rect x="48" y="5" width="10" height="32" rx="3"/>
      <path d="M82 28c12-15 31-15 43 0l-7 7c-8-9-21-9-29 0zm10 10c6-7 16-7 22 0l-11 11z"/>
      <rect x="143" y="9" width="61" height="32" rx="9" fill="none" stroke="#123C37" stroke-width="4"/>
      <rect x="207" y="18" width="5" height="14" rx="2"/>
      <rect x="149" y="15" width="45" height="20" rx="5"/>
    </g>
  </g>

  <!-- Header -->
  <g transform="translate(72 139)">
    <circle cx="38" cy="38" r="36" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/>
    <path d="M27 27l22 22M49 27L27 49" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="645" y="190" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Craving Rescue</text>
  <g transform="translate(942 149)">
    <rect width="276" height="64" rx="32" fill="#E6F1EA"/>
    <path d="M25 35c8-10 19-10 27 0M33 43c4-5 8-5 12 0" fill="none" stroke="#123C37" stroke-width="4" stroke-linecap="round"/>
    <text x="169" y="42" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="1.2">OFFLINE READY</text>
  </g>

  <!-- Main copy -->
  <text x="72" y="335" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27" letter-spacing="5">RIGHT NOW</text>
  <text x="72" y="433" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="67" letter-spacing="-3">Let’s get through this moment.</text>
  <text x="72" y="505" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="32">Start with what you feel now. No typing is required.</text>

  <!-- Intensity -->
  <g transform="translate(72 571)" filter="url(#s17shadow)">
    <rect width="1146" height="629" rx="44" fill="url(#s17hero)"/>
    <circle cx="1016" cy="111" r="158" fill="#285850" opacity="0.82"/>
    <text x="42" y="67" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="23" letter-spacing="3">CRAVING INTENSITY</text>
    <text x="42" y="130" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">How strong is it right now?</text>

    <g transform="translate(851 55)">
      <circle cx="101" cy="101" r="101" fill="#FF7D61"/>
      <text x="101" y="112" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="88">8</text>
      <text x="101" y="151" text-anchor="middle" fill="#FFF0EB" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="2">STRONG</text>
    </g>

    <g transform="translate(42 252)">
      <rect y="21" width="1062" height="20" rx="10" fill="#456A63"/>
      <rect y="21" width="826" height="20" rx="10" fill="#FF7D61"/>
      <circle cx="826" cy="31" r="36" fill="#FF7D61" stroke="#123C37" stroke-width="7"/>
      <g fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="21" text-anchor="middle">
        <text x="0" y="105">1</text><text x="118" y="105">2</text><text x="236" y="105">3</text><text x="354" y="105">4</text>
        <text x="472" y="105">5</text><text x="590" y="105">6</text><text x="708" y="105">7</text>
        <text x="826" y="105" fill="#FFFFFF" font-weight="700">8</text><text x="944" y="105">9</text><text x="1062" y="105">10</text>
      </g>
      <text x="0" y="148" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Mild</text>
      <text x="1062" y="148" text-anchor="end" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">Strongest</text>
    </g>

    <line x1="42" y1="447" x2="1104" y2="447" stroke="#3F6660" stroke-width="2"/>
    <g transform="translate(42 483)">
      <circle cx="39" cy="39" r="36" fill="#234E48"/>
      <path d="M20 42c9-19 18-19 27 0s18 19 27 0" fill="none" stroke="#D5EF75" stroke-width="5" stroke-linecap="round"/>
      <text x="98" y="34" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">You only need to choose a number.</text>
      <text x="98" y="71" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">The next screen gives one recommended action.</text>
    </g>
  </g>

  <!-- Optional context -->
  <g transform="translate(72 1242)" filter="url(#s17shadow)">
    <rect width="1146" height="481" rx="40" fill="#FFFDF7"/>
    <text x="36" y="64" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="33">What might be behind it?</text>
    <text x="1110" y="64" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Optional · Skip anytime</text>

    <g transform="translate(36 104)">
      <rect width="260" height="78" rx="30" fill="url(#s17mint)" stroke="#FF7D61" stroke-width="3"/>
      <circle cx="42" cy="39" r="19" fill="#123C37"/>
      <path d="M32 39l7 7 12-16" fill="none" stroke="#D5EF75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="157" y="50" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Stress</text>
      <rect x="278" width="307" height="78" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
      <text x="432" y="50" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">After a meal</text>
      <rect x="603" width="471" height="78" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
      <text x="839" y="50" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Around someone smoking</text>

      <rect y="98" width="279" height="78" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
      <text x="140" y="148" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Driving</text>
      <rect x="297" y="98" width="272" height="78" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
      <text x="433" y="148" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Alcohol</text>
      <rect x="587" y="98" width="252" height="78" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
      <text x="713" y="148" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Bored</text>
      <rect x="857" y="98" width="217" height="78" rx="30" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
      <text x="966" y="148" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Not sure</text>
    </g>

    <line x1="36" y1="322" x2="1110" y2="322" stroke="#E1E9E4" stroke-width="2"/>
    <g transform="translate(36 350)">
      <circle cx="35" cy="35" r="31" fill="#E6F1EA"/>
      <path d="M35 20v20M35 51v1" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round"/>
      <text x="88" y="31" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="24">Used to personalize support — never to monitor you.</text>
      <text x="88" y="64" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">No background location or conversation tracking.</text>
    </g>
  </g>

  <!-- Top reason -->
  <g transform="translate(72 1765)" filter="url(#s17shadow)">
    <rect width="1146" height="204" rx="36" fill="url(#s17mint)" stroke="#B9DCCB" stroke-width="3"/>
    <circle cx="84" cy="102" r="49" fill="#FFF0EB"/>
    <path d="M84 126s-31-19-31-41c0-17 22-24 31-8 9-16 31-9 31 8 0 22-31 41-31 41z" fill="#FF7D61"/>
    <text x="158" y="72" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="2">YOUR TOP REASON</text>
    <text x="158" y="128" fill="#123C37" font-family="Georgia, serif" font-style="italic" font-size="40">“Protect my family.”</text>
    <text x="158" y="166" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">This moment can pass without changing your goal.</text>
  </g>

  <!-- Human support -->
  <g transform="translate(72 2012)" filter="url(#s17shadow)">
    <rect width="1146" height="185" rx="34" fill="#FFFDF7" stroke="#CDDAD4" stroke-width="3"/>
    <circle cx="76" cy="77" r="43" fill="#E6F1EA"/>
    <circle cx="76" cy="65" r="12" fill="none" stroke="#123C37" stroke-width="5"/>
    <path d="M53 101c3-17 43-17 46 0" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round"/>
    <text x="139" y="65" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="32">Want a person instead?</text>
    <text x="139" y="108" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="24">Contact Jordan or a trained quitline counselor.</text>
    <g transform="translate(866 48)">
      <rect width="238" height="77" rx="38" fill="#E6F1EA"/>
      <text x="119" y="49" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">View support</text>
    </g>
    <text x="36" y="161" fill="#8BA09A" font-family="Nimbus Sans, Arial, sans-serif" font-size="20">Messages and calls only happen when you choose them.</text>
  </g>

  <!-- Primary action -->
  <g transform="translate(72 2244)">
    <rect width="1146" height="151" rx="31" fill="#123C37"/>
    <text x="573" y="94" fill="#FFFFFF" text-anchor="middle" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="39">Show me what to do</text>
    <path d="M1054 76h28m-11-11 11 11-11 11" fill="none" stroke="#D5EF75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Safety link -->
  <g transform="translate(72 2440)">
    <rect width="1146" height="101" rx="27" fill="#EFF5F1"/>
    <path d="M44 36h28v25H44zM50 36v-8c0-11 16-11 16 0v8" fill="none" stroke="#718A84" stroke-width="4" stroke-linecap="round"/>
    <text x="94" y="61" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Private · Works offline · One-handed controls</text>
    <text x="1094" y="61" text-anchor="end" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22">Medical emergency?</text>
  </g>

  <text x="645" y="2638" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">Trigger details are optional and never block Rescue</text>

  <!-- iOS home indicator -->
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
