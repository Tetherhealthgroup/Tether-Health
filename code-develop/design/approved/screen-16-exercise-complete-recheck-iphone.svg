<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="s16bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="1" stop-color="#F5F2E8"/>
    </linearGradient>
    <linearGradient id="s16mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F5ED"/>
      <stop offset="1" stop-color="#C7E6D8"/>
    </linearGradient>
    <filter id="s16shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#123C37" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#s16bg)"/>

  <!-- iOS status bar -->
  <g fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700">
    <text x="74" y="76" font-size="36">9:41</text>
    <g transform="translate(1056 43)">
      <rect x="0" y="22" width="10" height="15" rx="3"/>
      <rect x="16" y="17" width="10" height="20" rx="3"/>
      <rect x="32" y="11" width="10" height="26" rx="3"/>
      <rect x="48" y="5" width="10" height="32" rx="3"/>
      <path d="M82 28c12-15 31-15 43 0l-7 7c-8-9-21-9-29 0zm10 10c6-7 16-7 22 0l-11 11z"/>
      <rect x="143" y="9" width="61" height="32" rx="9" fill="none" stroke="#123C37" stroke-width="4"/>
      <rect x="207" y="18" width="5" height="14" rx="2"/>
      <rect x="149" y="15" width="45" height="20" rx="5"/>
    </g>
  </g>

  <!-- Header -->
  <g transform="translate(72 139)">
    <circle cx="38" cy="38" r="36" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="2"/>
    <path d="M27 27l22 22M49 27L27 49" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="645" y="190" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Stress reset</text>
  <g transform="translate(995 149)">
    <rect width="223" height="64" rx="32" fill="#E6F1EA"/>
    <circle cx="34" cy="32" r="17" fill="#123C37"/>
    <path d="M25 32l6 6 12-15" fill="none" stroke="#D5EF75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="143" y="42" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="1.2">COMPLETE</text>
  </g>

  <!-- Calm completion hero -->
  <g transform="translate(0 278)">
    <circle cx="645" cy="151" r="137" fill="#E6F1EA"/>
    <circle cx="645" cy="151" r="101" fill="url(#s16mint)" stroke="#B9DCCB" stroke-width="3"/>
    <circle cx="645" cy="151" r="65" fill="#123C37"/>
    <path d="M610 151l24 24 49-61" fill="none" stroke="#D5EF75" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="645" y="354" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="59" letter-spacing="-2">You gave the feeling time to change.</text>
    <text x="645" y="417" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="31">Take a moment to notice what is different now.</text>
  </g>

  <!-- Completion summary -->
  <g transform="translate(72 734)" filter="url(#s16shadow)">
    <rect width="1146" height="191" rx="36" fill="#FFFDF7"/>
    <g transform="translate(36 31)">
      <circle cx="53" cy="53" r="47" fill="#E6F1EA"/>
      <path d="M53 28v26l18 10" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="117" y="47" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="2">TIME</text>
      <text x="117" y="90" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="35">3:02</text>
    </g>
    <line x1="386" y1="36" x2="386" y2="155" stroke="#E1E9E4" stroke-width="2"/>
    <g transform="translate(422 31)">
      <circle cx="53" cy="53" r="47" fill="#E6F1EA"/>
      <path d="M35 53l12 12 26-33" fill="none" stroke="#123C37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="117" y="47" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="2">STEPS</text>
      <text x="117" y="90" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="35">3 of 3</text>
    </g>
    <line x1="772" y1="36" x2="772" y2="155" stroke="#E1E9E4" stroke-width="2"/>
    <g transform="translate(808 31)">
      <circle cx="53" cy="53" r="47" fill="#E6F1EA"/>
      <path d="M34 58c12-15 27-15 39 0M42 68c7-7 15-7 22 0" fill="none" stroke="#123C37" stroke-width="5" stroke-linecap="round"/>
      <text x="117" y="47" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="2">STATUS</text>
      <text x="117" y="90" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="35">Saved</text>
    </g>
  </g>

  <!-- Re-rate craving -->
  <g transform="translate(72 970)" filter="url(#s16shadow)">
    <rect width="1146" height="400" rx="39" fill="#FFFDF7"/>
    <text x="36" y="65" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="34">How strong is the craving now?</text>
    <text x="36" y="108" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="25">Choose the number that feels closest.</text>
    <g transform="translate(900 30)">
      <rect width="210" height="69" rx="35" fill="#E6F1EA"/>
      <text x="105" y="45" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">3 · Mild</text>
    </g>

    <g transform="translate(36 179)">
      <rect y="18" width="1074" height="18" rx="9" fill="#DCE6E0"/>
      <rect y="18" width="322" height="18" rx="9" fill="#123C37"/>
      <circle cx="322" cy="27" r="31" fill="#123C37" stroke="#FFFDF7" stroke-width="7"/>
      <g fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="19" text-anchor="middle">
        <text x="0" y="90">0</text><text x="107" y="90">1</text><text x="215" y="90">2</text><text x="322" y="90" fill="#123C37" font-weight="700">3</text>
        <text x="430" y="90">4</text><text x="537" y="90">5</text><text x="644" y="90">6</text><text x="752" y="90">7</text>
        <text x="859" y="90">8</text><text x="967" y="90">9</text><text x="1074" y="90">10</text>
      </g>
      <text x="0" y="132" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="20">No craving</text>
      <text x="1074" y="132" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="20">Strongest</text>
    </g>
    <g transform="translate(36 328)">
      <rect width="1074" height="47" rx="23" fill="#EFF5F1"/>
      <text x="537" y="32" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">There is no “good” score — honest answers improve your support.</text>
    </g>
  </g>

  <!-- Before and after -->
  <g transform="translate(72 1412)" filter="url(#s16shadow)">
    <rect width="1146" height="283" rx="39" fill="#123C37"/>
    <text x="42" y="58" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="3">TODAY’S RESULT</text>
    <g transform="translate(42 90)">
      <rect width="282" height="126" rx="28" fill="#234E48"/>
      <text x="141" y="39" text-anchor="middle" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">BEFORE</text>
      <text x="141" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="55">6 / 10</text>
      <path d="M340 63h132m-20-20 20 20-20 20" fill="none" stroke="#D5EF75" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="530" width="282" height="126" rx="28" fill="#234E48"/>
      <text x="671" y="39" text-anchor="middle" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">NOW</text>
      <text x="671" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="55">3 / 10</text>
      <g transform="translate(838 18)">
        <rect width="194" height="91" rx="30" fill="#D5EF75"/>
        <text x="97" y="38" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="30">↓ 3</text>
        <text x="97" y="67" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="18">POINTS</text>
      </g>
    </g>
    <text x="42" y="257" fill="#BFD5CD" font-family="Nimbus Sans, Arial, sans-serif" font-size="21">One result, not a promise — patterns become clearer over time.</text>
  </g>

  <!-- What helped -->
  <g transform="translate(72 1737)" filter="url(#s16shadow)">
    <rect width="1146" height="296" rx="38" fill="#FFFDF7"/>
    <text x="36" y="61" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="32">What helped most?</text>
    <text x="1110" y="61" text-anchor="end" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">Optional</text>
    <g transform="translate(36 98)">
      <rect width="343" height="75" rx="29" fill="url(#s16mint)" stroke="#FF7D61" stroke-width="3"/>
      <circle cx="40" cy="38" r="18" fill="#123C37"/>
      <path d="M31 38l6 6 11-14" fill="none" stroke="#D5EF75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="202" y="48" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Slow breathing</text>
      <rect x="361" width="240" height="75" rx="29" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
      <text x="481" y="48" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Water</text>
      <rect x="619" width="455" height="75" rx="29" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
      <text x="847" y="48" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Switching activities</text>
      <rect y="94" width="300" height="75" rx="29" fill="#FFFDF7" stroke="#C9D7D2" stroke-width="3"/>
      <text x="150" y="142" text-anchor="middle" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="24">Not sure yet</text>
    </g>
  </g>

  <!-- Personalization insight -->
  <g transform="translate(72 2072)">
    <rect width="1146" height="127" rx="30" fill="url(#s16mint)"/>
    <circle cx="64" cy="64" r="32" fill="#123C37"/>
    <path d="M48 65l10 10 22-28" fill="none" stroke="#D5EF75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="54" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">We’ll prioritize slow breathing when stress is high.</text>
    <text x="118" y="91" fill="#536F69" font-family="Nimbus Sans, Arial, sans-serif" font-size="23">You can change this preference anytime.</text>
  </g>

  <!-- Support -->
  <g transform="translate(72 2237)">
    <rect width="1146" height="102" rx="27" fill="#FFF0EB" stroke="#FFC6B7" stroke-width="2"/>
    <text x="36" y="62" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">Still need more support?</text>
    <text x="1060" y="62" text-anchor="end" fill="#FF7D61" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="25">Open Rescue</text>
    <path d="M1080 38l14 14-14 14" fill="none" stroke="#FF7D61" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Actions -->
  <g transform="translate(72 2381)">
    <rect width="1146" height="141" rx="30" fill="#123C37"/>
    <text x="573" y="88" fill="#FFFFFF" text-anchor="middle" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="38">Save result</text>
    <path d="M1054 70h28m-11-11 11 11-11 11" fill="none" stroke="#D5EF75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="645" y="2597" text-anchor="middle" fill="#123C37" font-family="Nimbus Sans, Arial, sans-serif" font-weight="700" font-size="27">Repeat exercise</text>
  <text x="645" y="2641" text-anchor="middle" fill="#718A84" font-family="Nimbus Sans, Arial, sans-serif" font-size="22">Result saves offline and syncs securely</text>

  <!-- iOS home indicator -->
  <rect x="468" y="2738" width="354" height="16" rx="8" fill="#123C37"/>
</svg>
